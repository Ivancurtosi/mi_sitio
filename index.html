<body>

                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" class="whatsapp-icon">

        <h1>Merchandising UTN Haedo</h1>

        <section class="catalog-section">
            <h2>Merchandising UTN</h2>
            <div class="product-grid" id="merch-grid" aria-live="polite"></div>
        </section>

        <section class="catalog-section">
            <h2>Calculadoras Casio</h2>
            <div class="product-grid" id="calculators-grid" aria-live="polite"></div>

        <section class="catalog-section catalog-section-last">

            <div class="product-grid" id="watches-grid" aria-live="polite"></div>
        </section>
    </div>

    <a
        href="https://wa.me/5491158449552?text=Hola%2C%20vi%20la%20p%C3%A1gina%20de%20Merchandising%20UTN%20Haedo%20y%20quer%C3%ADa%20consultar%20por%20un%20producto."
        target="_blank"
        rel="noopener noreferrer"
        class="whatsapp-floating"
        aria-label="Consultar por WhatsApp"
        title="Consultar por WhatsApp"
    >
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="">
    </a>

    <div id="modal" class="modal" aria-hidden="true">
        <button class="close" type="button" aria-label="Cerrar imagen" onclick="closeModal()">&times;</button>
        <img class="modal-content" id="modal-image" alt="Imagen ampliada del producto">
    </div>

    <script>
        const merchProducts = [

            { name: 'Libreta Rocket', price: 7000, image: 'imagenes/producto3.png' },
            { name: 'Bolígrafo UTN', price: 1100, image: 'imagenes/producto4.jpeg' },
            { name: 'Portalápices UTN', price: 4500, image: 'imagenes/producto5.jpeg' },
            { name: 'Gorra blanca UTN', price: 10000, image: 'imagenes/producto6.jpeg' },
            { name: 'Gorra negra UTN', price: 10000, image: 'imagenes/producto7.jpeg' },
            { name: 'Gorra Trucker azul', price: 8000, image: 'imagenes/producto8.jpeg' },
            { name: 'Remera blanca UTN', price: 16000, image: 'imagenes/producto9.jpeg' },
            { name: 'Remera gris UTN', price: 16000, image: 'imagenes/producto10.jpeg' },
            { name: 'Pin UTN', price: 3500, image: 'imagenes/producto11.jpeg' },
            { name: 'Remera UTN al espacio', price: 20000, image: 'imagenes/producto12.jpeg', soldOut: true },
            { name: 'Llavero UTN', price: 4000, image: 'imagenes/producto13.jpeg' },
            { name: 'Botella Runner', price: 8000, image: 'imagenes/producto14.jpeg' },
            { name: 'Remera UTN', price: 20000, image: 'imagenes/producto15.jpeg', soldOut: true },
            { name: 'Mate UTN', price: 6000, image: 'imagenes/producto16.jpeg' },
            { name: 'Porta Sube UTN', price: 1000, image: 'imagenes/producto17.jpeg' },
            { name: 'Yerbero Despolvillador', price: 8500, image: 'imagenes/producto18.jpeg' }
        ];

        const calculatorProducts = [
            {
                name: 'FX-570LAPLUS-2',
                price: 50000,
                image: 'https://www.casio.com/content/dam/casio/product-info/locales/latin/es-ar/calc/product/scientific/F/FX/FX5/fx-570LAPLUS-2/assets/fx-570LAPLUS-2_Seq1.jpg.transform/main-visual-sp/image.jpg',
                description: 'Esta calculadora es la mejor relación costo beneficio ya que además de las funciones clásicas incluye: Integrales // Derivadas // Matrices // Complejos // Cambio de Base.'
            },
            {
                name: 'FX-991LAPLUS-2',
                price: 56000,
                image: 'https://www.casio.com/content/dam/casio/product-info/locales/latin/es-ar/calc/product/scientific/F/FX/FX9/fx-991LAPLUS-2/assets/fx-991LAPLUS-2_Seq1.jpg.transform/main-visual-sp/image.jpg',
                description: 'Es una reversión de la 570. Cuenta con una carcaza más compacta, alimentación alternativa por panel solar y una mayor vida útil de la batería.'
            },
            {
                name: 'FX-7400GIII',
                price: 140000,
                image: 'https://www.casio.com/content/dam/casio/product-info/locales/mx/es-ar/calc/product/scientific/F/FX/FX7/fx-7400GIII/assets/fx-7400GIII_Seq1.jpg.transform/main-visual-sp/image.jpg',
                description: 'Este modelo cuenta con capacidades gráficas además de las funciones de los otros modelos disponibles. También se puede programar para la resolución de funciones en CASIO Basic. A tener en cuenta que este tipo de calculadoras (graficadoras) no se admiten en exámenes.'
            }
        ];

        const watchProducts = [
            {
                name: 'Smartwatch Mistral SMT-W69MN-01',
                price: 77000,
                image: 'https://acdn-us.mitiendanube.com/stores/917/694/products/smt-w69mn-01-b384dd804326a47e6c17384379887798-1024-1024.webp',
                description: 'Reloj inteligente con pantalla táctil HD de 1.95″, resistente al agua (IP68), GPS integrado y sensores de salud (frecuencia cardíaca, presión arterial, SpO2 y ECG). Permite hacer y recibir llamadas por Bluetooth, controlar música y viene con correas intercambiables + funda protectora. Ideal para el día a día o entrenamientos.'
            },
            {
                name: 'Smartwatch Mistral SMT-XY46-09',
                price: 70000,
                image: 'imagenes/mistral_xy46_user.jpg',
                description: 'Pantalla táctil de 1.86″, resistencia IP67 y batería de larga duración. Mide frecuencia cardíaca, presión, oxígeno en sangre y sueño. Recibe notificaciones, atiende llamadas por Bluetooth y tiene modo deportivo. Ideal para el día a día y entrenamientos.'
            },
            {
                name: 'Smartwatch Mistral SMT-X052-02',
                price: 54000,
                image: 'imagenes/mistral_x052_user.jpg',
                description: 'Pantalla táctil de 1.47″ (172×320 px), caja de acero inoxidable con correa de silicona/resina y flash de 64 MB; se conecta por Bluetooth (2.0 + BLE 5.0) y tiene GPS integrado; sensores de ritmo cardíaco, presión arterial, SpO₂, temperatura, podómetro y monitoreo de sueño, además de modos multideporte, cronómetro, alarmas, recordatorio de hidratación/sedentarismo, control de música y cámara; viene con resistencia al agua y polvo (IP67) y garantía oficial.'
            }
        ];

        const priceFormatter = new Intl.NumberFormat('es-AR');

        function renderProducts(gridId, products) {
            const grid = document.getElementById(gridId);

            grid.innerHTML = products.map((product) => `
                <article class="product${product.soldOut ? ' sold-out' : ''}">
                    <p class="product-name">${product.name}</p>
                    <button
                        class="product-image-button"
                        type="button"
                        aria-label="Ver imagen ampliada de ${product.name}"
                        onclick="openModal('${product.image}', '${product.name}')"
                    >
                        <span class="product-image-container">
                            ${product.soldOut ? '<span class="stock-badge">AGOTADO</span>' : ''}
                            <img src="${product.image}" alt="${product.name}" class="product-image" loading="lazy">
                        </span>
                    </button>
                    <p class="price">$${priceFormatter.format(product.price)}</p>
                    ${product.description ? `<p class="product-description">${product.description}</p>` : ''}
                </article>
            `).join('');
        }

        function openModal(imageSrc, productName = 'Producto') {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modal-image');
            modalImage.src = imageSrc;
            modalImage.alt = productName;
            modal.style.display = 'flex';
            modal.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modal-image');
            modal.style.display = 'none';
            modal.setAttribute('aria-hidden', 'true');
            modalImage.removeAttribute('src');
        }

        document.getElementById('modal').addEventListener('click', (event) => {
            if (event.target.id === 'modal') {
                closeModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        renderProducts('merch-grid', merchProducts);
        renderProducts('calculators-grid', calculatorProducts);
        renderProducts('watches-grid', watchProducts);
    </script>
</body>
</html>
