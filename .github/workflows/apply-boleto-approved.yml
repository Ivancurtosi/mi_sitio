name: Apply approved boleto fixes

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch published boleto page
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('boleto-estudiantil-final/index.html')
          html = path.read_text(encoding='utf-8')

          # 1) Sacar el botón extra del paso final, sin afectar la navegación lateral/por pasos.
          html = html.replace('<button class="btn secondary" type="button" data-next-step="2">← Volver a datos y advertencia</button>', '')
          html = html.replace('<button class="btn secondary" type="button" data-next-step="2">Volver a datos y advertencia</button>', '')

          # 2) Asegurar que el ejemplo de "El trámite caducó" sea una imagen embebida visible.
          caducado_b64 = ''
          shot = f'<div class="shot"><img src="data:image/jpeg;base64,{caducado_b64}" alt="Ejemplo del mensaje El trámite caducó"><div class="caption">Ejemplo de pantalla de <strong>“El trámite caducó”</strong>.</div></div>'
          html = re.sub(r'<div class="shot"><img src="data:image/[^\"]+" alt="Ejemplo del mensaje El trámite caducó"><div class="caption">Ejemplo de pantalla de <strong>“El trámite caducó”</strong>\.</div></div>', shot, html, count=1)
          html = re.sub(r'<div class="example-shot">.*?El trámite caducó.*?</div>\s*</div>', shot, html, count=1, flags=re.S)

          # 3) Asegurar que exista el error de alumno no regular.
          if 'data-case="noregular"' not in html:
              html = html.replace(
                  '<button class="case-card" data-case="blanco"><strong>Me aparece todo en blanco</strong>',
                  '<button class="case-card" data-case="noregular"><strong>Error: el alumno no es regular</strong><span>El sistema no reconoce el requisito académico para iniciar el trámite.</span></button><button class="case-card" data-case="blanco"><strong>Me aparece todo en blanco</strong>'
              )
              html = html.replace(
                  '<button class="case-card" type="button" data-case="blanco"><strong>Me aparece todo en blanco</strong>',
                  '<button class="case-card" type="button" data-case="noregular"><strong>Error: el alumno no es regular</strong><span>El sistema no reconoce el requisito académico para iniciar el trámite.</span></button><button class="case-card" type="button" data-case="blanco"><strong>Me aparece todo en blanco</strong>'
              )

          if 'noregular:{' not in html:
              mailto_no_regular = 'mailto:asuntos@frh.utn.edu.ar?subject=Boleto%20Estudiantil%20-%20Alumno%20no%20regular&body=Hola%2C%20al%20intentar%20iniciar%20el%20tr%C3%A1mite%20del%20Boleto%20Estudiantil%20me%20aparece%20el%20error%3A%20%22el%20alumno%20no%20es%20regular%22.%0A%0ADatos%3A%0ANombre%20y%20apellido%3A%0ADNI%3A%0ALegajo%3A%0ACarrera%3A%0A%0AYa%20revis%C3%A9%20si%20tengo%203%20materias%20aprobadas%20del%20ciclo%20lectivo%20anterior%20y%20si%20las%20notas%20figuran%20cargadas%20en%20Autogesti%C3%B3n.%0A%0AAdjunto%20captura%20del%20error.%0A%0AMuchas%20gracias.%0ASaludos.'
              noregular = "noregular:{k:'Requisito académico',t:'Error: el alumno no es regular',s:'El sistema no reconoce que cumplas el requisito académico para iniciar el trámite.',b:'<h3>Qué significa</h3><ul><li>Para iniciar el trámite tenés que tener <strong>3 materias aprobadas</strong> del ciclo lectivo anterior.</li><li>No alcanza con tener materias regularizadas: tienen que estar <strong>aprobadas del todo</strong> y figurar cargadas en Autogestión.</li></ul><h3>Si vos sí tenés 3 materias aprobadas</h3><ul><li>Revisá en Autogestión que estén cargadas todas las notas.</li><li>Si falta una nota, acercate o consultá al Departamento de tu carrera para que puedan resolver la carga.</li><li>Si no lográs resolverlo, escribí a SAE con tus datos y una captura del error.</li></ul><div class=\"btnrow\"><a class=\"btn secondary\" href=\"" + mailto_no_regular + "\">Enviar mail</a></div>'},"
              html = html.replace('blanco:{', noregular + 'blanco:{')

          # 4) Reforzar la explicación de precargas acumuladas en el caso de no acreditación, sin tocar otras secciones.
          if 'Muchas personas no lo notan porque puede aparecer saldo acumulado de meses anteriores' not in html:
              html = re.sub(
                  r"noacredita:\{k:'Acreditación'.*?\},subedigital:\{",
                  "noacredita:{k:'Acreditación',t:'Completé el formulario, pero no me acreditaron',s:'Revisá tiempos, SUBE física, precargas pendientes y reclamo.',b:'<h3>Revisá primero</h3><ul><li>Que haya pasado el plazo de procesamiento correspondiente.</li><li>Que estés usando la <strong>SUBE física</strong> correcta.</li><li>Que la SUBE Digital no haya quedado como tarjeta predeterminada.</li><li>Que hayas acreditado la precarga en Terminal Automática SUBE, app SUBE con NFC o Carga a Bordo.</li></ul><h3>Precargas o sobrantes acumulados</h3><p>Puede pasar que el Ministerio haya otorgado saldo, pero que vos todavía no lo hayas acreditado en tu SUBE física. Hasta que no lo acreditás, queda como <strong>precarga pendiente</strong>.</p><p>También puede pasar que queden <strong>sobrantes de meses anteriores</strong>. Por ejemplo: si el Ministerio otorga más saldo del que la SUBE te deja acreditar de una sola vez, una parte puede quedar pendiente y acumularse para más adelante.</p><p>Esos sobrantes pueden habilitarse incluso en <strong>enero o febrero</strong>. Aunque en esos meses no haya una nueva precarga por no haber clases, puede aparecer saldo acumulado de meses anteriores. Muchas personas no lo notan porque piensan que en esos meses no había nada para cargar.</p><p>Si se juntan <strong>dos precargas disponibles</strong> y no las acreditás, el sistema puede entender que no estás usando el beneficio y suspenderlo momentáneamente.</p><h3>Qué hacer</h3><p>Acreditá las precargas pendientes en tu SUBE física cuando estén disponibles. Si el beneficio quedó suspendido o dejaste de recibir la precarga, hacé el reclamo ante el Ministerio con la opción <strong>“No recibí mi precarga”</strong>.</p><div class=\"btnrow\"><a class=\"btn secondary\" target=\"_blank\" href=\"'+links.ministerio+'\">Formulario Ministerio</a></div>'},subedigital:{",
                  html,
                  count=1,
                  flags=re.S
              )

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-boleto-approved.yml
          git add boleto-estudiantil-final/index.html
          git commit -m "Apply approved boleto page fixes"
          git push
