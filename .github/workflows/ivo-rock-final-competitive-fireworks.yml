name: Ivo Rock competitive finale and fireworks

on:
  push:
    paths:
      - '.github/workflows/ivo-rock-final-competitive-fireworks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Patch competitive finale layout
        shell: python
        run: |
          from pathlib import Path

          game_path = Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js')
          mount_path = Path('salto-cosmico-rock/mount.js')
          index_path = Path('salto-cosmico-rock/index.html')
          s = game_path.read_text()

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s = s.replace(old, new, 1)

          # Five amplifier steps, ascent only. The top edge sits 240 px before the mast.
          one('...g(7248,5,1),...g(7536,4,-1)', '...g(7344,5,1)', 'route 1 ascent')
          one('...g(6816,5,1),...g(7104,4,-1)', '...g(7056,5,1)', 'route 2 ascent')
          one('...g(7056,5,1),...g(7344,4,-1)', '...g(7008,5,1)', 'route 3 ascent')
          one('p(6480,432,`solid`,void 0,3),...g(6816,5,1)]', 'p(6480,432,`solid`,void 0,3),...g(6528,5,1)]', 'route 4 ascent')

          one('startX:7170,startFeetY:624,target:{x:7248,y:576,w:48,h:48}', 'startX:7270,startFeetY:624,target:{x:7344,y:576,w:48,h:48}', 'route 1 reach check')
          one('startX:6750,startFeetY:624,target:{x:6816,y:576,w:48,h:48}', 'startX:6450,startFeetY:624,target:{x:6528,y:576,w:48,h:48}', 'route 4 reach check')

          # Tighten the mast scoring zones so full-speed jumping is what earns 5000.
          one(
              'goalTier=J.y+J.h<=350?4:J.y+J.h<=420?3:J.y+J.h<=490?2:J.y+J.h<=560?1:0',
              'goalTier=J.y+J.h<=285?4:J.y+J.h<=365?3:J.y+J.h<=445?2:J.y+J.h<=525?1:0',
              'height tiers'
          )

          game_path.write_text(s)

          mount = mount_path.read_text().replace('complete-pass-3', 'finale-competition-1')
          mount_path.write_text(mount)

          index = index_path.read_text().replace('complete-pass-3', 'finale-competition-1')
          fireworks_css = '<link rel="stylesheet" href="./ivo-rock-fireworks.css?v=finale-competition-1">'
          if fireworks_css not in index:
              marker = '<link rel="stylesheet" href="./ivo-rock-stats.css?v=finale-competition-1">'
              if marker not in index:
                  raise SystemExit('stats css marker missing')
              index = index.replace(marker, marker + '\n  ' + fireworks_css, 1)
          index_path.write_text(index)

      - name: Validate JavaScript
        run: |
          node --check salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js
          node --check salto-cosmico-rock/ivo-rock-polish.js
          node --check salto-cosmico-rock/mount.js

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js salto-cosmico-rock/mount.js salto-cosmico-rock/index.html
          git commit -m "Make Ivo Rock finales competitive"
          git push origin master
