name: Smoke test Salto Cosmico Rock

on:
  push:
    paths:
      - '.github/workflows/smoke-salto-rock.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for latest published Rock Tour and verify assets
        shell: bash
        run: |
          set -euo pipefail
          url='https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/'
          ok=0
          for i in {1..24}; do
            if curl -fsSL "${url}mount.js?live=5" -o /tmp/mount.js \
              && grep -q 'hydrateRoot' /tmp/mount.js \
              && grep -q 'rockHydrated' /tmp/mount.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsSL "${url}?live=5" -o /tmp/game.html
          curl -fsSL "${url}assets/cosmic-jump-DkePWGqE.js?live=5" -o /tmp/game.js
          curl -fsSL "${url}assets/rock-hero.webp?live=5" -o /tmp/hero.webp
          curl -fsSL "${url}assets/rock-props.webp?live=5" -o /tmp/props.webp
          curl -fsSL "${url}audio/track1.mp3?live=5" -o /tmp/track1.mp3
          curl -fsSL "${url}audio/track5.mp3?live=5" -o /tmp/track5.mp3
          grep -q 'SALTO CÓSMICO // ROCK TOUR' /tmp/game.html
          grep -q 'crouched:34' /tmp/game.js
          grep -q 'fastJumpVelocity:-890' /tmp/game.js
          grep -q '__rockPlaylist' /tmp/game.js
          test -s /tmp/hero.webp
          test -s /tmp/props.webp
          test -s /tmp/track1.mp3
          test -s /tmp/track5.mp3

      - name: Verify game interaction in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rock-diag
          python3 -m pip install --quiet websocket-client
          url='https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/?browser=5'
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/rock-chrome \
            "$url" >/tmp/rock-diag/chrome.out 2>/tmp/rock-diag/chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9222/json > /tmp/rock-diag/tabs.json && break
            sleep 1
          done
          python3 - <<'PY'
          import json, time, traceback
          import websocket
          diag=[]
          try:
              tabs=json.load(open('/tmp/rock-diag/tabs.json'))
              page=next(t for t in tabs if t.get('type')=='page')
              ws=websocket.create_connection(page['webSocketDebuggerUrl'], timeout=10, suppress_origin=True)
              seq=0
              def evaluate(expr):
                  global seq
                  seq += 1
                  ws.send(json.dumps({'id':seq,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':True}}))
                  while True:
                      msg=json.loads(ws.recv())
                      if msg.get('id')==seq:
                          if 'exceptionDetails' in msg.get('result',{}):
                              raise RuntimeError(msg['result']['exceptionDetails'])
                          res=msg['result']['result']
                          return res.get('value') if 'value' in res else {'type':res.get('type'),'description':res.get('description')}

              deadline=time.time()+15
              while time.time()<deadline:
                  if evaluate("document.documentElement.dataset.rockHydrated === '1'"):
                      break
                  time.sleep(.25)
              else:
                  raise RuntimeError('Rock Tour did not hydrate')

              body=evaluate("document.body.innerText.toLowerCase()")
              assert 'salto cósmico // rock tour' in body
              assert 'arrancar la gira' in body
              assert evaluate("typeof window.__rockPlaylist === 'object'")
              assert evaluate("!!document.querySelector('.game-canvas')")
              diag.append('PRESTART OK')

              evaluate("document.querySelector('.play-btn').click(); true")
              deadline=time.time()+10
              while time.time()<deadline:
                  if evaluate("!!document.querySelector('.rock-analog')"):
                      break
                  time.sleep(.25)
              else:
                  raise RuntimeError('Analog control did not appear after starting')

              assert evaluate("!!document.querySelector('.action-btn')")
              assert evaluate("!!document.querySelector('.jump-btn')")
              assert evaluate("!!document.querySelector('.move-controls')")
              assert evaluate("document.querySelector('.overlay') === null || getComputedStyle(document.querySelector('.overlay')).display === 'none'")
              diag.append('LIVE ROCK TOUR OK: hydrated, start works, analog/run/jump present')
              ws.close()
          except Exception:
              diag.append('TRACEBACK:\n'+traceback.format_exc())
              raise
          finally:
              open('/tmp/rock-diag/diagnostic.txt','w').write('\n\n'.join(diag))
          PY

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-tour-diagnostics
          path: /tmp/rock-diag/
