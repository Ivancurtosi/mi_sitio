name: Smoke test Salto Cosmico Rock

# Rerun after GitHub Pages finished publishing the polish build.
on:
  push:
    paths:
      - '.github/workflows/smoke-salto-rock.yml'
      - 'salto-cosmico-rock/index.html'
      - 'salto-cosmico-rock/mount.js'
      - 'salto-cosmico-rock/rock-tour-controls.js'
      - 'salto-cosmico-rock/rock-tour-updates.css'
      - 'salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for fresh published polish build
        shell: bash
        run: |
          set -euo pipefail
          url='https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/'
          ok=0
          for i in {1..50}; do
            curl -fsSL "${url}?polish=2" -o /tmp/index.html || true
            curl -fsSL "${url}mount.js?polish=2" -o /tmp/mount.js || true
            curl -fsSL "${url}rock-tour-controls.js?polish=2" -o /tmp/controls.js || true
            curl -fsSL "${url}rock-tour-updates.css?polish=2" -o /tmp/updates.css || true
            curl -fsSL "${url}assets/cosmic-jump-DkePWGqE.js?polish=2" -o /tmp/game.js || true
            if grep -q 'mount.js?v=rock-polish-2' /tmp/index.html 2>/dev/null \
              && grep -q 'rock-tour-updates.css?v=rock-polish-2' /tmp/index.html 2>/dev/null \
              && grep -q 'cosmic-jump-DkePWGqE.js?v=rock-polish-2' /tmp/mount.js 2>/dev/null \
              && grep -q 'rock-tour-controls.js?v=rock-polish-2' /tmp/mount.js 2>/dev/null \
              && grep -q 'CROSSFADE_MS = 1200' /tmp/mount.js 2>/dev/null \
              && grep -q 'safeFullscreen' /tmp/controls.js 2>/dev/null \
              && grep -q 'rock-fullscreen-guard' /tmp/updates.css 2>/dev/null \
              && grep -q 'play(this.currentTheme)' /tmp/game.js 2>/dev/null \
              && grep -q 'r<te+12' /tmp/game.js 2>/dev/null \
              && grep -q 'rgba(12, 2, 18, .36)' /tmp/game.js 2>/dev/null; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Verify Android gameplay controls still work
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/rock-chrome about:blank >/tmp/chrome.out 2>/tmp/chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:9222/json >/tmp/tabs.json && break; sleep 1; done
          python3 - <<'PY'
          import json,time,websocket
          tabs=json.load(open('/tmp/tabs.json'))
          page=next(t for t in tabs if t.get('type')=='page')
          ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=10,suppress_origin=True)
          seq=0
          def call(method,params=None):
              global seq
              seq+=1; ident=seq
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==ident:
                      if 'error' in msg: raise RuntimeError(msg['error'])
                      return msg.get('result',{})
          def ev(expr):
              return call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'awaitPromise':True})['result'].get('value')
          def sample():
              return ev("({x:window.__rockPlayerX,t:performance.now(),run:window.__rockRunHeld})")
          def speed(a,b):
              return (b['x']-a['x'])/max(.001,(b['t']-a['t'])/1000)
          call('Emulation.setUserAgentOverride',{'userAgent':'Mozilla/5.0 (Linux; Android 16; SM-A356E) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','platform':'Android'})
          call('Emulation.setDeviceMetricsOverride',{'width':915,'height':412,'deviceScaleFactor':2.625,'mobile':True,'screenWidth':915,'screenHeight':412,'screenOrientation':{'type':'landscapePrimary','angle':90}})
          call('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':5})
          call('Page.enable'); call('Runtime.enable'); call('Page.navigate',{'url':'https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/?v=rock-polish-2'})
          deadline=time.time()+20
          while time.time()<deadline:
              try:
                  if ev("document.documentElement.dataset.rockHydrated === '1'"): break
              except: pass
              time.sleep(.25)
          else: raise RuntimeError('No hidrato')

          if not ev("(()=>{const e=document.querySelector('.fullscreen-btn');return !!e && getComputedStyle(e).display!=='none' && e.dataset.safeFullscreen==='1'})()"):
              raise RuntimeError('Pantalla completa segura no instalada')

          play=ev("(()=>{const r=document.querySelector('.play-btn').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}})()")
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'id':1,'x':play['x'],'y':play['y'],'force':1}]})
          call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
          deadline=time.time()+8
          while time.time()<deadline:
              if ev("!!document.querySelector('.rock-analog') && !!document.querySelector('.action-btn') && !!document.querySelector('.jump-btn') && typeof window.__rockControl==='function' && typeof window.__rockPlayerX==='number'"): break
              time.sleep(.2)
          else: raise RuntimeError('No inicio el juego o faltan controles')

          ev("window.__rockControl('right',true,'test:right-ui'); true")
          time.sleep(.4)
          a=sample(); time.sleep(.30); b=sample(); walk=speed(a,b)
          rb=ev("(()=>{const e=document.querySelector('.action-btn');const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}})()")
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'id':11,'x':rb['x'],'y':rb['y'],'radiusX':4,'radiusY':4,'force':1}]})
          time.sleep(.15)
          if ev('window.__rockRunHeld') is not True: raise RuntimeError('CORRER no activa carrera')
          c=sample(); time.sleep(.30); d=sample(); run=speed(c,d)
          call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
          time.sleep(.08)
          ev("window.__rockControl('right',false,'test:right-ui'); true")
          print(f'WALK_SPEED={walk:.1f} RUN_SPEED={run:.1f}')
          if not (160 <= walk <= 290): raise RuntimeError(f'Velocidad caminata inesperada: {walk}')
          if run <= max(300,walk*1.25): raise RuntimeError(f'CORRER no acelera: walk={walk}, run={run}')
          print('ROCK_POLISH_ANDROID_OK')
          ws.close()
          PY
