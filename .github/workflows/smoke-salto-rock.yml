name: Smoke test Salto Cosmico Rock

on:
  push:
    paths:
      - '.github/workflows/smoke-salto-rock.yml'
      - 'salto-cosmico-rock/index.html'
      - 'salto-cosmico-rock/mount.js'
      - 'salto-cosmico-rock/rock-tour-controls.js'
      - 'salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for fresh published CORRER build
        shell: bash
        run: |
          set -euo pipefail
          url='https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/'
          ok=0
          for i in {1..45}; do
            curl -fsSL "${url}?run-held=6" -o /tmp/index.html || true
            curl -fsSL "${url}mount.js?run-held=6" -o /tmp/mount.js || true
            curl -fsSL "${url}rock-tour-controls.js?run-held=6" -o /tmp/controls.js || true
            curl -fsSL "${url}assets/cosmic-jump-DkePWGqE.js?run-held=6" -o /tmp/game.js || true
            if grep -q 'mount.js?v=run-held-6' /tmp/index.html 2>/dev/null \
              && grep -q 'cosmic-jump-DkePWGqE.js?v=run-held-6' /tmp/mount.js 2>/dev/null \
              && grep -q 'rock-tour-controls.js?v=run-held-6' /tmp/mount.js 2>/dev/null \
              && grep -q '__rockRunHeld = false' /tmp/controls.js 2>/dev/null \
              && grep -q 'window.__rockRunHeld' /tmp/game.js 2>/dev/null; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Verify real Android CORRER touch increases speed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/rock-chrome about:blank >/tmp/chrome.out 2>/tmp/chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:9222/json >/tmp/tabs.json && break; sleep 1; done
          python3 - <<'PY'
          import json,time,websocket
          tabs=json.load(open('/tmp/tabs.json'))
          page=next(t for t in tabs if t.get('type')=='page')
          ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=10,suppress_origin=True)
          seq=0
          def call(method,params=None):
              global seq
              seq+=1; ident=seq
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==ident:
                      if 'error' in msg: raise RuntimeError(msg['error'])
                      return msg.get('result',{})
          def ev(expr):
              return call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'awaitPromise':True})['result'].get('value')
          call('Emulation.setUserAgentOverride',{'userAgent':'Mozilla/5.0 (Linux; Android 16; SM-A356E) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','platform':'Android'})
          call('Emulation.setDeviceMetricsOverride',{'width':915,'height':412,'deviceScaleFactor':2.625,'mobile':True,'screenWidth':915,'screenHeight':412,'screenOrientation':{'type':'landscapePrimary','angle':90}})
          call('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':5})
          call('Page.enable'); call('Runtime.enable'); call('Page.navigate',{'url':'https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/?v=run-held-6'})
          deadline=time.time()+20
          while time.time()<deadline:
              try:
                  if ev("document.documentElement.dataset.rockHydrated === '1'"): break
              except: pass
              time.sleep(.25)
          else: raise RuntimeError('No hidrato')
          play=ev("(()=>{const r=document.querySelector('.play-btn').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}})()")
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'id':1,'x':play['x'],'y':play['y'],'force':1}]})
          call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
          deadline=time.time()+8
          while time.time()<deadline:
              if ev("!!document.querySelector('.action-btn') && typeof window.__rockControl==='function' && typeof window.__rockPlayerX==='number' && typeof window.__rockRunHeld==='boolean'"): break
              time.sleep(.2)
          else: raise RuntimeError('No inicio el juego')

          # Hold movement directly so the only physical touch under test is CORRER.
          ev("window.__rockControl('right',true,'test:right-ui'); true")
          time.sleep(.7)
          x0=ev('window.__rockPlayerX'); time.sleep(.35); x1=ev('window.__rockPlayerX'); walk=x1-x0

          rb=ev("(()=>{const e=document.querySelector('.action-btn');const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,pe:getComputedStyle(e).pointerEvents}})()")
          if rb['pe']!='auto': raise RuntimeError('El boton CORRER no recibe pointer events')
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'id':11,'x':rb['x'],'y':rb['y'],'radiusX':4,'radiusY':4,'force':1}]})
          time.sleep(.12)
          held=ev('window.__rockRunHeld')
          if held is not True: raise RuntimeError('El toque sobre CORRER no activa __rockRunHeld')
          time.sleep(.25)
          x2=ev('window.__rockPlayerX'); time.sleep(.35); x3=ev('window.__rockPlayerX'); run=x3-x2
          call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
          time.sleep(.08)
          released=ev('window.__rockRunHeld')
          ev("window.__rockControl('right',false,'test:right-ui'); true")
          print(f'WALK={walk:.2f} RUN={run:.2f} HELD={held} RELEASED={released}')
          if walk <= 20: raise RuntimeError(f'Marcha invalida: {walk}')
          if run <= walk*1.25: raise RuntimeError(f'CORRER no acelera lo suficiente: walk={walk}, run={run}')
          if released is not False: raise RuntimeError('CORRER quedo trabado al soltar')
          print('REAL_CORRER_TOUCH_OK')
          ws.close()
          PY
