name: Smoke test Salto Cosmico Rock

on:
  push:
    paths:
      - '.github/workflows/smoke-salto-rock.yml'
      - 'salto-cosmico-rock/rock-tour-controls.js'
      - 'salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for published CORRER fix
        shell: bash
        run: |
          set -euo pipefail
          url='https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/'
          ok=0
          for i in {1..40}; do
            curl -fsSL "${url}rock-tour-controls.js?action=5" -o /tmp/controls.js || true
            curl -fsSL "${url}assets/cosmic-jump-DkePWGqE.js?action=5" -o /tmp/game.js || true
            if grep -q "sendControl('action', true)" /tmp/controls.js 2>/dev/null \
              && grep -q 'window.__rockControl=N' /tmp/game.js 2>/dev/null \
              && grep -q 'window.__rockPlayerX=J.x' /tmp/game.js 2>/dev/null; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Verify engine action and real Android CORRER touch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/rock-chrome about:blank >/tmp/chrome.out 2>/tmp/chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:9222/json >/tmp/tabs.json && break; sleep 1; done
          python3 - <<'PY'
          import json,time,websocket
          tabs=json.load(open('/tmp/tabs.json'))
          page=next(t for t in tabs if t.get('type')=='page')
          ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=10,suppress_origin=True)
          seq=0
          def call(method,params=None):
              global seq
              seq+=1; ident=seq
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==ident:
                      if 'error' in msg: raise RuntimeError(msg['error'])
                      return msg.get('result',{})
          def ev(expr):
              return call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'awaitPromise':True})['result'].get('value')
          call('Emulation.setUserAgentOverride',{'userAgent':'Mozilla/5.0 (Linux; Android 16; SM-A356E) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','platform':'Android'})
          call('Emulation.setDeviceMetricsOverride',{'width':915,'height':412,'deviceScaleFactor':2.625,'mobile':True,'screenWidth':915,'screenHeight':412,'screenOrientation':{'type':'landscapePrimary','angle':90}})
          call('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':5})
          call('Page.enable'); call('Runtime.enable'); call('Page.navigate',{'url':'https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/?action-run=5'})
          deadline=time.time()+20
          while time.time()<deadline:
              try:
                  if ev("document.documentElement.dataset.rockHydrated === '1'"): break
              except: pass
              time.sleep(.25)
          else: raise RuntimeError('No hidrato')
          play=ev("(()=>{const r=document.querySelector('.play-btn').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}})()")
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':play['x'],'y':play['y'],'force':1}]})
          call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
          deadline=time.time()+8
          while time.time()<deadline:
              if ev("!!document.querySelector('.action-btn') && typeof window.__rockControl==='function' && typeof window.__rockPlayerX==='number'"): break
              time.sleep(.2)
          else: raise RuntimeError('No inicio el juego')

          # A) Prove the engine's real action control changes speed.
          ev("window.__rockControl('right',true,'test:right'); true")
          time.sleep(1.2)
          x0=ev('window.__rockPlayerX'); time.sleep(.55); x1=ev('window.__rockPlayerX'); walk_engine=x1-x0
          ev("window.__rockControl('action',true,'test:action'); true")
          time.sleep(.35)
          x2=ev('window.__rockPlayerX'); time.sleep(.55); x3=ev('window.__rockPlayerX'); run_engine=x3-x2
          ev("window.__rockControl('action',false,'test:action'); window.__rockControl('right',false,'test:right'); true")
          print(f'ENGINE WALK={walk_engine:.2f} RUN={run_engine:.2f}')
          if walk_engine <= 10 or run_engine <= walk_engine*1.20:
              raise RuntimeError(f'El action interno no acelera: walk={walk_engine}, run={run_engine}')

          # B) Keep right held directly, but press the visible CORRER button with a real Android touch.
          ev("window.__rockControl('right',true,'test:right-ui'); true")
          time.sleep(.8)
          x4=ev('window.__rockPlayerX'); time.sleep(.45); x5=ev('window.__rockPlayerX'); walk_ui=x5-x4
          rb=ev("(()=>{const e=document.querySelector('.action-btn');const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,pe:getComputedStyle(e).pointerEvents}})()")
          if rb['pe']!='auto': raise RuntimeError('El boton CORRER no recibe pointer events')
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'id':11,'x':rb['x'],'y':rb['y'],'radiusX':4,'radiusY':4,'force':1}]})
          time.sleep(.35)
          x6=ev('window.__rockPlayerX'); time.sleep(.55); x7=ev('window.__rockPlayerX'); run_ui=x7-x6
          call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
          ev("window.__rockControl('right',false,'test:right-ui'); true")
          print(f'UI WALK={walk_ui:.2f} RUN={run_ui:.2f}')
          if walk_ui <= 10 or run_ui <= walk_ui*1.20:
              raise RuntimeError(f'El toque real sobre CORRER no acelera: walk={walk_ui}, run={run_ui}')
          print('REAL_CORRER_TOUCH_OK')
          ws.close()
          PY
