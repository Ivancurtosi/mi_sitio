name: Smoke test Salto Cosmico Rock

on:
  push:
    paths:
      - '.github/workflows/smoke-salto-rock.yml'
      - 'salto-cosmico-rock/rock-tour-controls.js'
      - 'salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for published CORRER fix
        shell: bash
        run: |
          set -euo pipefail
          url='https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/'
          ok=0
          for i in {1..40}; do
            curl -fsSL "${url}rock-tour-controls.js?action=4" -o /tmp/controls.js || true
            curl -fsSL "${url}assets/cosmic-jump-DkePWGqE.js?action=4" -o /tmp/game.js || true
            if grep -q "sendControl('action', true)" /tmp/controls.js 2>/dev/null \
              && grep -q 'window.__rockControl=N' /tmp/game.js 2>/dev/null \
              && grep -q 'window.__rockPlayerX=J.x' /tmp/game.js 2>/dev/null; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Verify Android CORRER increases real speed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/rock-chrome about:blank >/tmp/chrome.out 2>/tmp/chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:9222/json >/tmp/tabs.json && break; sleep 1; done
          python3 - <<'PY'
          import json,time,websocket
          tabs=json.load(open('/tmp/tabs.json'))
          page=next(t for t in tabs if t.get('type')=='page')
          ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=10,suppress_origin=True)
          seq=0
          def call(method,params=None):
              global seq
              seq+=1; ident=seq
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==ident:
                      if 'error' in msg: raise RuntimeError(msg['error'])
                      return msg.get('result',{})
          def ev(expr):
              return call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'awaitPromise':True})['result'].get('value')
          call('Emulation.setUserAgentOverride',{'userAgent':'Mozilla/5.0 (Linux; Android 16; SM-A356E) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','platform':'Android'})
          call('Emulation.setDeviceMetricsOverride',{'width':915,'height':412,'deviceScaleFactor':2.625,'mobile':True,'screenWidth':915,'screenHeight':412,'screenOrientation':{'type':'landscapePrimary','angle':90}})
          call('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':5})
          call('Page.enable'); call('Runtime.enable'); call('Page.navigate',{'url':'https://ivancurtosi.github.io/mi_sitio/salto-cosmico-rock/?action-run=4'})
          deadline=time.time()+20
          while time.time()<deadline:
              try:
                  if ev("document.documentElement.dataset.rockHydrated === '1'"): break
              except: pass
              time.sleep(.25)
          else: raise RuntimeError('No hidrato')
          play=ev("(()=>{const r=document.querySelector('.play-btn').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}})()")
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':play['x'],'y':play['y'],'force':1}]})
          call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
          deadline=time.time()+8
          while time.time()<deadline:
              if ev("!!document.querySelector('.rock-analog') && !!document.querySelector('.action-btn') && typeof window.__rockControl==='function' && typeof window.__rockPlayerX==='number'"): break
              time.sleep(.2)
          else: raise RuntimeError('No inicio el juego')
          a=ev("(()=>{const r=document.querySelector('.rock-analog').getBoundingClientRect();return{x:r.left+r.width*.83,y:r.top+r.height*.5}})()")
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':a['x'],'y':a['y'],'force':1}]})
          time.sleep(1.2)
          x0=ev('window.__rockPlayerX'); time.sleep(.55); x1=ev('window.__rockPlayerX'); walk=x1-x0
          rb=ev("(()=>{const r=document.querySelector('.action-btn').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}})()")
          ev(f"(()=>{{const e=document.querySelector('.action-btn');e.dispatchEvent(new PointerEvent('pointerdown',{{pointerId:77,bubbles:true,cancelable:true,clientX:{rb['x']},clientY:{rb['y']},pointerType:'touch'}}));return true}})()")
          time.sleep(.35)
          x2=ev('window.__rockPlayerX'); time.sleep(.55); x3=ev('window.__rockPlayerX'); run=x3-x2
          ev("document.dispatchEvent(new PointerEvent('pointerup',{pointerId:77,bubbles:true,cancelable:true,pointerType:'touch'}));true")
          call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
          print(f'WALK={walk:.2f} RUN={run:.2f}')
          if walk <= 10: raise RuntimeError(f'Analog sin movimiento estable: {walk}')
          if run <= walk*1.12: raise RuntimeError(f'CORRER no acelera: walk={walk}, run={run}')
          ws.close()
          PY
