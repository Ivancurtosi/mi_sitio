name: Patch Rock Tour optional tower and distinct backgrounds

on:
  push:
    paths:
      - '.github/workflows/patch-rock-tower-backgrounds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Make final obstacle optional and separate the four visual worlds
        shell: python
        run: |
          from pathlib import Path

          game = Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js')
          s = game.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} pattern not found')
              s = s.replace(old, new, 1)

          # Give every route a clearly different primary background image.
          replace_once(
              "p={grove:[`./assets/rock-concert.webp`,`./assets/metal-wasteland.webp`],cavern:[`./assets/metal-forge.webp`,`./assets/prism-cavern.png`],sky:[`./assets/metal-storm.webp`,`./assets/dawn-isles.png`],citadel:[`./assets/metal-wasteland.webp`,`./assets/prism-cavern.png`]}",
              "p={grove:[`./assets/rock-concert.webp`,`./assets/metal-wasteland.webp`],cavern:[`./assets/prism-cavern.png`,`./assets/metal-forge.webp`],sky:[`./assets/metal-storm.webp`,`./assets/dawn-isles.png`],citadel:[`./assets/metal-wasteland.webp`,`./assets/prism-cavern.png`]}",
              'background map'
          )

          # Stronger visual identity: warm concert -> underground cavern -> storm -> apocalypse.
          old_fx = "e.fillStyle={grove:`rgba(70, 8, 3, .15)`,cavern:`rgba(5, 0, 10, .58)`,sky:`rgba(1, 4, 15, .48)`,citadel:`rgba(18, 0, 3, .58)`}[E.biome],e.fillRect(0,0,t,720),E.biome===`sky`&&("
          new_fx = "e.fillStyle={grove:`rgba(70, 8, 3, .06)`,cavern:`rgba(3, 0, 8, .68)`,sky:`rgba(1, 5, 18, .42)`,citadel:`rgba(20, 0, 3, .64)`}[E.biome],e.fillRect(0,0,t,720),E.biome===`grove`&&(e.save(),e.globalAlpha=.22,Array.from({length:6},(_,rr)=>rr).forEach(rr=>{let xx=t*(.08+rr*.18);e.fillStyle=rr%2?`rgba(255,55,28,.18)`:`rgba(255,215,82,.14)`,e.beginPath(),e.moveTo(xx-20,0),e.lineTo(xx+20,0),e.lineTo(xx+125,520),e.lineTo(xx-125,520),e.closePath(),e.fill()}),e.restore()),E.biome===`cavern`&&(e.save(),e.fillStyle=`rgba(0,0,0,.78)`,e.beginPath(),e.moveTo(0,0),Array.from({length:16},(_,rr)=>rr).forEach(rr=>{let xx=rr*t/15,yy=52+((rr*37)%5)*25;e.lineTo(xx,yy)}),e.lineTo(t,0),e.closePath(),e.fill(),e.globalAlpha=.28,e.fillStyle=`#5e1d78`,e.fillRect(0,500,t,220),e.globalAlpha=.18,e.fillStyle=`#b547cf`,Array.from({length:7},(_,rr)=>rr).forEach(rr=>{let xx=t*(.08+rr*.15);e.fillRect(xx,94+(rr%3)*38,3,300)}),e.restore()),E.biome===`sky`&&("
          replace_once(old_fx, new_fx, 'biome atmosphere')

          # Make the final optional obstacle easier to clear with a normal jump.
          replace_once("Ae=e=>e===`warden`?{w:94,h:88}:", "Ae=e=>e===`warden`?{w:82,h:70}:", 'tower size')

          # Replace the round monster drawing with a stack of rock amplifiers/speakers.
          old_warden = "if(t.kind===`warden`){e.save();let n=.85+Math.sin(T*5)*.1;e.translate(t.x+t.w/2,t.y+t.h/2),e.scale(n,n),e.fillStyle=`#382044`,e.beginPath(),e.arc(0,0,43,0,Math.PI*2),e.fill(),e.strokeStyle=t.guard>0?`#fff29b`:`#e56893`,e.lineWidth=7,e.stroke(),e.fillStyle=`#78fff1`,e.fillRect(-28,-8,56,17),e.fillStyle=`#0b1732`,e.fillRect(J.x<t.x?-20:10,-4,10,8),e.fillStyle=`#ffcb70`;for(let n=0;n<t.health;n++)e.fillRect(-30+n*11,30,7,5);e.restore();return}"
          new_warden = "if(t.kind===`warden`){e.save();let n=1+Math.sin(T*5)*.018;e.translate(t.x+t.w/2,t.y+t.h/2),e.scale(n,n),e.shadowColor=t.guard>0?`#ffe56e`:`#ff354f`,e.shadowBlur=18,e.fillStyle=`#121215`,Q(e,-37,-31,74,64,6),e.fill(),e.strokeStyle=`#666872`,e.lineWidth=4,e.stroke(),e.fillStyle=`#24242a`,Q(e,-29,-24,58,25,4),e.fill(),Q(e,-29,5,58,25,4),e.fill(),e.strokeStyle=`#7a7b83`,e.lineWidth=2,e.strokeRect(-29,-24,58,25),e.strokeRect(-29,5,58,25),e.fillStyle=`#050506`;for(let n of[-17,17]){e.beginPath(),e.arc(n,-12,9,0,Math.PI*2),e.fill(),e.beginPath(),e.arc(n,17,9,0,Math.PI*2),e.fill()}e.fillStyle=`#e52335`,e.fillRect(-25,-28,8,4),e.fillStyle=`#ffd858`,e.beginPath(),e.moveTo(2,-21),e.lineTo(-7,-3),e.lineTo(1,-3),e.lineTo(-4,14),e.lineTo(12,-8),e.lineTo(4,-8),e.closePath(),e.fill(),e.fillStyle=`#ffc95e`;for(let n=0;n<t.health;n++)e.fillRect(-29+n*10,35,6,4);e.restore();return}"
          replace_once(old_warden, new_warden, 'warden visual')

          # The finish amplifier is always available; destroying the tower is only a bonus.
          replace_once("let n=!L.some(e=>e.kind===`warden`&&e.active&&e.state!==`dead`);", "let n=!0;", 'goal availability')

          old_finish = "let n=L.find(e=>e.kind===`warden`&&e.active&&e.state!==`dead`),rr=!!n;if(n&&J.x>=E.goalX-700){n.awake=!0;let e=De(E.goalX-360);(n.x<E.goalX-520||n.x>E.goalX-210||n.y>650)&&(n.x=E.goalX-360,n.y=e-n.h,n.vx=0,n.vy=0),J.x>E.goalX-120&&(J.x=E.goalX-120,J.vx=Math.min(0,J.vx)),q.time<=0&&(window.__rockPlaylist?.play(`boss`),Y(`EL GUARDIÁN DEL RUIDO`,`DERROTALO: 6 golpes para abrir el amplificador`,1.2))}!Te&&J.x+J.w>=E.goalX&&!rr&&(Te=!0,G=2.35,J.invulnerable=9,u.current.left=!1,u.current.right=!1,X(Math.max(0,Math.ceil(O))*10+2e3),Y(ve===_.length-1?`¡GIRA COMPLETA!`:`RECITAL COMPLETO`,`Etapa ${E.id} superada`,2.1),o.current?.stopMusic(),o.current?.sfx(`goal`));let i=S(720*(r.width/Math.max(1,r.height)),c,1640),s=Math.min(i*.4,560);J.x-D>s&&(D=Math.max(D,J.x-s)),rr&&J.x>=E.goalX-700&&(D=Math.min(D,Math.max(E.startX-re,E.goalX-980))),D=S(D,E.startX-re,Math.max(0,E.width-i)),K=Math.max(0,K-e)"
          new_finish = "let n=L.find(e=>e.kind===`warden`&&e.active&&e.state!==`dead`),rr=!!n;if(n&&J.x>=E.goalX-700){n.awake=!0;let e=De(E.goalX-390);(n.x<E.goalX-540||n.x>E.goalX-220||n.y>650)&&(n.x=E.goalX-390,n.y=e-n.h,n.vx=0,n.vy=0),q.time<=0&&(window.__rockPlaylist?.play(`boss`),Y(`TORRE DEL ESTRUENDO`,`Saltala para seguir · destruirla da bonus`,1.2))}!Te&&J.x+J.w>=E.goalX&&(Te=!0,G=2.35,J.invulnerable=9,u.current.left=!1,u.current.right=!1,X(Math.max(0,Math.ceil(O))*10+2e3),Y(ve===_.length-1?`¡GIRA COMPLETA!`:`RECITAL COMPLETO`,`Etapa ${E.id} superada`,2.1),o.current?.stopMusic(),o.current?.sfx(`goal`));let i=S(720*(r.width/Math.max(1,r.height)),c,1640),s=Math.min(i*.4,560);J.x-D>s&&(D=Math.max(D,J.x-s)),D=S(D,E.startX-re,Math.max(0,E.width-i)),K=Math.max(0,K-e)"
          replace_once(old_finish, new_finish, 'optional final tower')

          game.write_text(s)

          mount = Path('salto-cosmico-rock/mount.js')
          ms = mount.read_text()
          if "cosmic-jump-DkePWGqE.js?v=final-arena-visual-1" not in ms:
              raise SystemExit('mount cache pattern not found')
          ms = ms.replace("cosmic-jump-DkePWGqE.js?v=final-arena-visual-1", "cosmic-jump-DkePWGqE.js?v=rock-tower-bg-1", 1)
          mount.write_text(ms)

          index = Path('salto-cosmico-rock/index.html')
          ix = index.read_text()
          if "mount.js?v=final-arena-visual-1" not in ix:
              raise SystemExit('index cache pattern not found')
          ix = ix.replace("mount.js?v=final-arena-visual-1", "mount.js?v=rock-tower-bg-1", 1)
          index.write_text(ix)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js salto-cosmico-rock/mount.js salto-cosmico-rock/index.html
          git commit -m "Make final rock tower optional and separate level visuals"
          git push origin master
