name: Fix Ivo Rock black screen regression

on:
  push:
    paths:
      - '.github/workflows/fix-ivo-rock-black-screen.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 30
      - name: Restore accidentally removed world draw function
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          game=Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js')
          s=game.read_text()
          previous=subprocess.check_output([
              'git','show','1db89354a8ecbc0f474064e47e3e350d80b3b879:salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js'
          ], text=True)
          start=previous.find(',gt=')
          end=previous.find(',_t=', start)
          if start < 0 or end < 0:
              raise SystemExit(f'Could not recover gt function: start={start} end={end}')
          gt_segment=previous[start:end]
          if ',gt=' in s:
              raise SystemExit('Current engine unexpectedly already contains gt definition')
          marker=',_t='
          if s.count(marker) != 1:
              raise SystemExit(f'Expected one _t marker, got {s.count(marker)}')
          s=s.replace(marker, gt_segment+marker, 1)
          game.write_text(s)

          mount=Path('salto-cosmico-rock/mount.js')
          m=mount.read_text().replace('combat-guitar-1','combat-guitar-2')
          mount.write_text(m)
          index=Path('salto-cosmico-rock/index.html')
          i=index.read_text().replace('combat-guitar-1','combat-guitar-2')
          index.write_text(i)
      - name: Validate JavaScript
        run: |
          node --check salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js
          node --check salto-cosmico-rock/mount.js
      - name: Browser smoke test
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8765/salto-cosmico-rock/?v=smoke2' >/tmp/dom.txt 2>/tmp/chrome.log || true
          if grep -Eq 'INFO:CONSOLE.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/chrome.log; then
            grep -E 'INFO:CONSOLE.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/chrome.log
            exit 1
          fi
          grep -q 'ivo-start-menu' /tmp/dom.txt
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js salto-cosmico-rock/mount.js salto-cosmico-rock/index.html
          git commit -m "Fix Ivo Rock black screen after guitar finish update"
          git push origin master
