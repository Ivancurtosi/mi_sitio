name: Ivo Rock results screen and PWA pass

on:
  push:
    paths:
      - '.github/workflows/ivo-rock-results-pwa-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install icon dependency
        run: python3 -m pip install --quiet pillow

      - name: Apply Ivo Rock patch
        run: python3 .github/scripts/ivo-rock-results-pwa.py

      - name: Static validation
        run: |
          set -euxo pipefail
          node --check salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js
          node --check salto-cosmico-rock/mount.js
          node --check salto-cosmico-rock/ivo-rock-polish.js
          node --check salto-cosmico-rock/pwa.js
          node --check salto-cosmico-rock/service-worker.js
          python3 -m json.tool salto-cosmico-rock/manifest.webmanifest >/dev/null
          test -s salto-cosmico-rock/icons/ivo-rock-192.png
          test -s salto-cosmico-rock/icons/ivo-rock-512.png
          grep -q 'RUTA COMPLETADA' salto-cosmico-rock/ivo-rock-polish.js
          grep -q 'IVO ROCK RESULTS SCREEN V2' salto-cosmico-rock/ivo-rock-polish.css
          grep -q 'manifest.webmanifest' salto-cosmico-rock/index.html
          grep -q 'results-pwa-1' salto-cosmico-rock/mount.js
          grep -q 'ivoLiftBlockedShards' salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js
          ! grep -q 'x:5410,kind:`amp`' salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js
          grep -q 'DIABLITO EN LLAMAS' salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js

      - name: Browser smoke test
        run: |
          set -euxo pipefail
          python3 -m http.server 8765 >/tmp/ivo-http.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:8765/salto-cosmico-rock/?smoke=1&v=results-pwa-1' >/tmp/dom.txt 2>/tmp/chrome.log || true
          cat /tmp/chrome.log
          grep -q 'data-ivo-smoke="ok"' /tmp/dom.txt
          grep -q 'data-ivo-pwa="ready"' /tmp/dom.txt
          curl -fsS 'http://127.0.0.1:8765/salto-cosmico-rock/manifest.webmanifest' | grep -q 'standalone'
          curl -fsS 'http://127.0.0.1:8765/salto-cosmico-rock/service-worker.js' | grep -q 'ivo-rock-pwa-v1'
          if grep -Eq 'INFO:CONSOLE.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/chrome.log; then
            echo 'Runtime JavaScript error detected'
            exit 1
          fi

      - name: Commit release
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add salto-cosmico-rock
          git commit -m 'Add rock results screen and installable offline app'
          git push origin master
