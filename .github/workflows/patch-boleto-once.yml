name: Patch Boleto Once

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Boleto index
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import quote

          path = Path('boleto-estudiantil-final/index.html')
          html = path.read_text(encoding='utf-8')

          faq_no_acredito = '''<details class="faq-item" open><summary>¿Qué pasa si no acredito la precarga en mi SUBE?</summary><div class="faq-answer"><p>La precarga <strong>no se aplica sola</strong>: aunque el Ministerio la haya otorgado, queda pendiente hasta que la acreditás en tu <strong>SUBE física</strong>.</p><p>No conviene dejar precargas pendientes. Si se juntan <strong>dos precargas disponibles sin acreditar</strong>, el sistema puede interpretar que no estás usando el beneficio y suspenderlo momentáneamente.</p><p>También puede pasar que se acumulen sobrantes de meses anteriores. Por ejemplo, si el Ministerio otorgó más saldo del que la SUBE te deja acreditar de una sola vez, puede quedar una parte pendiente para más adelante.</p><p>Por eso algunas personas tuvieron saldos acumulados que se habilitaron en <strong>enero o febrero</strong>. Aunque en esos meses no haya una nueva precarga por no haber clases, podían tener saldo anterior pendiente para acreditar. Si no lo acreditaron, el sistema pudo tomarlo como dos precargas sin usar y suspender momentáneamente el beneficio.</p><p>Para resolverlo, entrá directamente al caso <strong>“Trámite finalizado / beneficio otorgado”</strong>, donde vas a encontrar el formulario del Ministerio y una explicación más completa.</p><p><a class="btn secondary" href="#errores-otorgado">Ir al caso “Trámite finalizado / beneficio otorgado”</a></p></div></details>'''
          html = re.sub(r'<details class="faq-item" open><summary>¿Qué pasa si se vencen las precargas\?</summary>.*?</details>', faq_no_acredito, html, count=1, flags=re.S)
          html = re.sub(r'<details class="faq-item" open><summary>¿Qué pasa si no acredito la precarga en mi SUBE\?</summary>.*?</details>', faq_no_acredito, html, count=1, flags=re.S)

          html = html.replace('Si quedó seleccionada la SUBE Digital, puede impedir la acreditación.', 'Si quedó seleccionada la SUBE Digital, la acreditación no se va a realizar correctamente.')
          html = html.replace('puede impedir la acreditación', 'la acreditación no se va a realizar correctamente')
          html = html.replace('puede impedir que se acredite correctamente', 'impide que se acredite correctamente')

          lost_sube = '''<details class="faq-item"><summary>¿Qué pasa si pierdo mi tarjeta SUBE con el beneficio aplicado?</summary><div class="faq-answer"><p>Si perdiste tu SUBE registrada y asociada al <strong>Boleto Estudiantil Nivel Universitario</strong>, tenés que ingresar a tu cuenta en <a href="https://www.argentina.gob.ar/sube" target="_blank" rel="noopener">argentina.gob.ar/sube</a>, con tu DNI y clave SUBE, o hacerlo desde la <strong>App SUBE</strong>.</p><p>Desde ahí tenés que solicitar la <strong>baja de la tarjeta perdida</strong>. Luego recibirás un correo electrónico con la confirmación de la baja, información sobre el saldo que pudiera haber quedado en esa tarjeta y cómo recuperarlo.</p><p>En la misma cuenta también vas a poder <strong>asociar tu nueva tarjeta SUBE</strong>.</p></div></details>'''
          if '¿Qué pasa si pierdo mi tarjeta SUBE con el beneficio aplicado?' not in html:
              anchor = '¿En qué SUBE se acredita el beneficio?'
              i = html.find(anchor)
              if i != -1:
                  j = html.find('</details>', i)
                  if j != -1:
                      html = html[:j+len('</details>')] + lost_sube + html[j+len('</details>'):]

          new_otorgado_block = '''<h3>Si todavía no recibiste la precarga</h3><ul><li>Si ya pasó el plazo que corresponde según la fecha en que hiciste el trámite y todavía no recibiste la precarga, hacé el reclamo en el formulario del Ministerio.</li><li>En el formulario del Ministerio, elegí la opción <strong>“No recibí mi precarga”</strong>.</li><li>Si dejás <strong>dos precargas disponibles sin acreditar</strong>, el sistema puede interpretar que no estás usando el beneficio y suspenderlo momentáneamente.</li><li>También puede pasar que queden <strong>sobrantes acumulados</strong> de meses anteriores. Por ejemplo, si el Ministerio otorgó más saldo del que la SUBE te deja acreditar de una sola vez, puede quedar una parte pendiente.</li><li>Esos sobrantes pueden habilitarse más adelante, incluso en <strong>enero o febrero</strong>. Aunque en esos meses no haya una nueva precarga por clases, puede aparecer saldo anterior pendiente. Si no lo acreditás, también puede contarse como precarga sin usar.</li></ul>'''
          html = re.sub(r'<h3>Si todavía no recibiste la precarga</h3>\s*<ul>.*?</ul>', new_otorgado_block, html, count=1, flags=re.S)

          acumuladas_error = '''<h3>Si tenías precargas o saldos acumulados</h3><ul><li>Si se juntan <strong>dos precargas disponibles sin acreditar</strong>, el sistema puede interpretar que no estás usando el beneficio y suspenderlo momentáneamente.</li><li>También puede pasar que se acumulen sobrantes de meses anteriores. Por ejemplo, si el Ministerio otorgó más saldo del que la SUBE te permite acreditar de una sola vez, puede quedar una parte pendiente para más adelante.</li><li>Eso pudo aparecer en <strong>enero o febrero</strong>: no porque haya una nueva precarga por clases, sino porque quedó saldo anterior pendiente. Si no lo acreditaste, el sistema pudo tomarlo como precarga sin usar.</li><li>En ese caso, realizá el reclamo en el formulario del Ministerio seleccionando <strong>“No recibí mi precarga”</strong>.</li></ul>'''
          if 'Si tenías precargas o saldos acumulados' not in html:
              html = re.sub(r'(noacredita:\s*\{.*?body:\s*`)', r'\1\n      ' + acumuladas_error, html, count=1, flags=re.S)

          mail_body = 'Hola, me aparece el error "el alumno no es regular" al intentar iniciar el trámite del Boleto Estudiantil.\n\nTengo 3 materias aprobadas del ciclo lectivo anterior, pero el sistema no me deja avanzar.\n\nDatos:\nNombre y apellido:\nDNI:\nLegajo:\nCarrera:\n\nAdjunto captura del error.\n\nMuchas gracias.\nSaludos.'
          mailto = 'mailto:asuntos@frh.utn.edu.ar?subject=' + quote('Boleto Estudiantil - Error alumno no regular') + '&body=' + quote(mail_body)
          noreg_btn = '<button class="case-card" type="button" data-case="noregular"><strong>Error: el alumno no es regular</strong><span>El sistema no reconoce el requisito académico para iniciar el trámite.</span></button>'
          if 'data-case="noregular"' not in html:
              if '<button class="case-card" type="button" data-case="blanco"' in html:
                  html = html.replace('<button class="case-card" type="button" data-case="blanco"', noreg_btn + '<button class="case-card" type="button" data-case="blanco"', 1)
              elif '<button class="case-card" type="button" data-case="noacredita"' in html:
                  html = html.replace('<button class="case-card" type="button" data-case="noacredita"', noreg_btn + '<button class="case-card" type="button" data-case="noacredita"', 1)

          noreg_obj = f'''  noregular: {{
    kicker: "Requisito académico",
    title: "Error: el alumno no es regular",
    subtitle: "El sistema no reconoce el requisito académico necesario para iniciar el trámite.",
    body: `
      <h3>Qué significa</h3>
      <ul>
        <li>Para iniciar el trámite necesitás tener <strong>3 materias aprobadas del ciclo lectivo anterior</strong>.</li>
        <li>No alcanza con tener materias regularizadas: tienen que estar <strong>aprobadas del todo</strong>, con la nota cargada en Autogestión.</li>
      </ul>
      <h3>Si tenés 3 materias aprobadas y aparece igual</h3>
      <ul>
        <li>Revisá en Autogestión que estén cargadas todas las notas.</li>
        <li>Si falta una nota, acercate o consultá al <strong>Departamento de tu carrera</strong> para que puedan resolver la carga.</li>
        <li>Si no lográs resolverlo, mandá mail a SAE con tus datos y una captura del error.</li>
      </ul>`,
    actions: [["Enviar mail a SAE", "{mailto}", "secondary"]],
    copy: "Para este error, primero verificá que tengas 3 materias aprobadas del ciclo lectivo anterior y que las notas figuren en Autogestión. Si falta una nota, consultá al Departamento de tu carrera. Si no se resuelve, escribí a SAE con captura y datos completos."
  }},
'''
          if 'noregular:' not in html:
              if '  blanco: {' in html:
                  html = html.replace('  blanco: {', noreg_obj + '  blanco: {', 1)
              elif '  noacredita: {' in html:
                  html = html.replace('  noacredita: {', noreg_obj + '  noacredita: {', 1)

          js_handler = """
document.querySelectorAll('a[href=\"#errores-otorgado\"]').forEach(function(link){
  link.addEventListener('click', function(e){
    e.preventDefault();
    if (panels && panels.errores) {
      panels.errores.classList.add('active');
      panels.errores.scrollIntoView({behavior:'smooth', block:'start'});
    }
    if (typeof openCase === 'function') openCase('otorgado');
  });
});
"""
          if '#errores-otorgado' in html and 'a[href=\"#errores-otorgado\"]' not in html:
              html = html.replace('</script>', js_handler + '\n</script>', 1)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-boleto-once.yml
          git add boleto-estudiantil-final/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply boleto content patch"
          git push
