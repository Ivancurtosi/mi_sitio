name: Ivo Rock height-bonus finale polish

on:
  push:
    paths:
      - '.github/workflows/ivo-rock-goal-festival-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Remove sky scaffold and upgrade level finales
        shell: python
        run: |
          from pathlib import Path

          game_path = Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js')
          polish_path = Path('salto-cosmico-rock/ivo-rock-polish.js')
          mount_path = Path('salto-cosmico-rock/mount.js')
          index_path = Path('salto-cosmico-rock/index.html')

          s = game_path.read_text()

          def one(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {s.count(old)}')
              s = s.replace(old, new, 1)

          # Remove the pale rectangular scaffold / stair-like overlay from Route 3.
          sky_scaffold = 'e.globalAlpha=.25,e.strokeStyle=`#6f7890`,e.lineWidth=5,e.strokeRect(t*.08,390,t*.84,88),e.beginPath(),Array.from({length:9},(_,rr)=>rr).forEach(rr=>{let xx=t*(.1+rr*.1);e.moveTo(xx,390),e.lineTo(xx+45,478)}),e.stroke(),'
          if s.count(sky_scaffold) != 1:
              raise SystemExit(f'sky scaffold: expected 1 match, got {s.count(sky_scaffold)}')
          s = s.replace(sky_scaffold, '', 1)

          # Track height bonus state. It is reset whenever a level starts/restarts.
          reset_marker = 'K=0,Te=!1,q='
          if s.count(reset_marker) != 2:
              raise SystemExit(f'goal state reset: expected 2 matches, got {s.count(reset_marker)}')
          s = s.replace(reset_marker, 'K=0,Te=!1,goalBonus=0,goalTier=0,q=', 2)

          # During the celebration, Ivo walks to the backstage/fortress entrance and waits there.
          one(
              'if(G>0){G-=e,J.vx=se(J.vx,128,540*e),J.x+=J.vx*e,G<=0&&(ve===_.length-1?(Ee(),M(`won`)):Ie(ve+1,!0));return}',
              'if(G>0){G-=e;let t=Math.min(E.width-J.w-42,E.goalX+155);J.x<t?(J.vx=se(J.vx,115,420*e),J.x=Math.min(t,J.x+J.vx*e)):J.vx=0,G<=0&&(ve===_.length-1?(Ee(),M(`won`)):Ie(ve+1,!0));return}',
              'goal walk'
          )

          # Height-sensitive finish: higher jump = bigger bonus, followed by a longer celebration.
          old_finish = '!Te&&J.x+J.w>=E.goalX&&(Te=!0,G=3.05,J.invulnerable=9,u.current.left=!1,u.current.right=!1,X(Math.max(0,Math.ceil(O))*10+2500),Z(E.goalX-42,520,`#ffe56b`,28,`spark`),Z(E.goalX+18,470,`#75fff2`,24,`spark`),Z(E.goalX-8,410,`#ff6d8f`,22,`spark`),Y(ve===_.length-1?`¡GIRA COMPLETA!`:`RECITAL COMPLETO`,`Etapa ${E.id} superada · bonus de tiempo`,2.65),o.current?.stopMusic(),o.current?.sfx(`goal`),window.__ivoRockPolish?.goal(ve===_.length-1,Math.max(0,Math.ceil(O))*10+2500));'
          new_finish = '!Te&&J.x+J.w>=E.goalX&&(Te=!0,goalTier=J.y+J.h<=350?4:J.y+J.h<=420?3:J.y+J.h<=490?2:J.y+J.h<=560?1:0,goalBonus=[200,700,1500,3000,5000][goalTier],G=4.2,J.invulnerable=9,u.current.left=!1,u.current.right=!1,X(Math.max(0,Math.ceil(O))*10+goalBonus),Z(E.goalX-52,540,`#ffe56b`,34,`spark`),Z(E.goalX+22,492,`#75fff2`,30,`spark`),Z(E.goalX-8,420,`#ff6d8f`,28,`spark`),Z(E.goalX+112,500,`#ff7a25`,26,`spark`),Z(E.goalX+170,470,`#ffe56b`,24,`spark`),Y(ve===_.length-1?`¡GIRA COMPLETA!`:`¡RUTA COMPLETADA!`,`ALTURA +${goalBonus} · TIEMPO +${Math.max(0,Math.ceil(O))*10}`,3.4),o.current?.stopMusic(),o.current?.sfx(`goal`),window.__ivoRockPolish?.goal(ve===_.length-1,Math.max(0,Math.ceil(O))*10+goalBonus,goalBonus));'
          one(old_finish, new_finish, 'height bonus finish')

          # Replace the simple amplifier goal with a rock-tour banner tower + backstage fortress.
          old_goal = 'ht=e=>{let t=E.goalX;if(!$({x:t-60,y:260,w:120,h:364}))return;e.fillStyle=`rgba(12,17,44,.65)`,Q(e,t-7,286,14,338,6),e.fill();let n=!0;e.shadowColor=n?`#77fff0`:`#e75b87`,e.shadowBlur=26,e.fillStyle=n?`#77fff0`:`#e75b87`,e.beginPath(),e.arc(t,280,23+Math.sin(T*5)*3,0,Math.PI*2),e.fill(),e.shadowBlur=0,e.fillStyle=`rgba(255,255,255,.75)`,e.beginPath(),e.arc(t-6,273,5,0,Math.PI*2),e.fill(),e.fillStyle=n?`rgba(119,255,240,.18)`:`rgba(231,91,135,.16)`,e.fillRect(t-54,304,108,320),w(e,C,n?0:2,t-48,528,96,96),w(e,C,n?0:2,t-42,444,84,84)},'
          new_goal = '''ht=e=>{let t=E.goalX,n=De(t);if(!$({x:t-100,y:218,w:350,h:n-218}))return;e.save();let r=t+82,i=n-158;e.fillStyle=`rgba(5,4,8,.88)`,Q(e,r,i,154,158,10),e.fill(),e.strokeStyle=`rgba(255,118,45,.45)`,e.lineWidth=4,e.stroke(),e.fillStyle=`#17151a`;for(let a=0;a<4;a++)e.fillRect(r+a*38,i-13-(a%2)*8,31,21);e.fillStyle=`#08080b`,Q(e,r+49,n-82,58,82,7),e.fill(),e.strokeStyle=`#8d3031`,e.lineWidth=3,e.stroke(),e.fillStyle=`#efaa42`,e.font=`900 11px ui-monospace,monospace`,e.textAlign=`center`,e.fillText(`BACKSTAGE`,r+77,i+25);for(let a of[25,129]){e.fillStyle=`#0b0b0e`,Q(e,r+a-19,i+48,38,74,6),e.fill();for(let o of[0,31]){e.strokeStyle=`#55545b`,e.lineWidth=2,e.beginPath(),e.arc(r+a,i+66+o,11,0,Math.PI*2),e.stroke()}}e.shadowColor=`#ff622d`,e.shadowBlur=16,e.fillStyle=`#ff6c31`;for(let a of[22,132]){let o=8+Math.sin(T*11+a)*5;e.beginPath(),e.moveTo(r+a,n),e.lineTo(r+a-10,n-o-20),e.lineTo(r+a,n-o-10),e.lineTo(r+a+10,n-o-24),e.closePath(),e.fill()}e.shadowBlur=0,e.fillStyle=`#11131a`,Q(e,t-6,244,12,n-244,5),e.fill(),e.strokeStyle=`rgba(220,231,255,.7)`,e.lineWidth=2,e.stroke();let a=[[280,`5000`],[360,`3000`],[440,`1500`],[520,`700`],[585,`200`]];e.textAlign=`right`,e.font=`800 11px ui-monospace,monospace`;for(let[o,s]of a)e.fillStyle=`rgba(255,232,151,.82)`,e.fillText(s,t-14,o+4),e.strokeStyle=`rgba(255,255,255,.22)`,e.lineWidth=1,e.beginPath(),e.moveTo(t-9,o),e.lineTo(t+8,o),e.stroke();e.shadowColor=`#77fff0`,e.shadowBlur=24,e.fillStyle=`#77fff0`,e.beginPath(),e.moveTo(t,218),e.lineTo(t+14,239),e.lineTo(t,256),e.lineTo(t-14,239),e.closePath(),e.fill(),e.shadowBlur=0;let o=Te?280+Math.min(1,(4.2-G)/1.1)*Math.max(0,n-370):280;e.fillStyle=`#a91c24`,Q(e,t+8,o-20,78,44,6),e.fill(),e.strokeStyle=`#f1b34d`,e.lineWidth=3,e.stroke(),e.fillStyle=`#ffe16a`,e.font=`900 23px ui-monospace,monospace`,e.textAlign=`center`,e.fillText(`⚡`,t+47,o+10),Te&&goalBonus>0&&(e.fillStyle=`#fff2a3`,e.font=`1000 18px ui-monospace,monospace`,e.fillText(`ALTURA +${goalBonus}`,t+44,230));e.restore()},'''
          one(old_goal, new_goal, 'goal tower visual')

          game_path.write_text(s)

          p = polish_path.read_text()
          if 'goal(final = false, bonus = 0) {' not in p:
              raise SystemExit('polish goal signature not found')
          p = p.replace('goal(final = false, bonus = 0) {', 'goal(final = false, bonus = 0, heightBonus = 0) {', 1)
          p = p.replace('sparks(final ? 34 : 24);', 'sparks(final ? 46 : 34);', 1)
          old_bonus = "celebrationBonus.textContent = `BONUS +${Math.max(0, Math.round(bonus)).toString().padStart(4, '0')}`;"
          new_bonus = "celebrationBonus.textContent = heightBonus > 0 ? `ALTURA +${Math.round(heightBonus)} · TOTAL +${Math.max(0, Math.round(bonus))}` : `BONUS +${Math.max(0, Math.round(bonus))}`;"
          if old_bonus not in p:
              raise SystemExit('celebration bonus line not found')
          p = p.replace(old_bonus, new_bonus, 1)
          p = p.replace("setTimeout(() => celebration.classList.remove('show'), final ? 2600 : 1900);", "setTimeout(() => celebration.classList.remove('show'), final ? 3400 : 2800);", 1)
          polish_path.write_text(p)

          mount = mount_path.read_text()
          mount = mount.replace("./assets/cosmic-jump-DkePWGqE.js?v=full-polish-1", "./assets/cosmic-jump-DkePWGqE.js?v=rock-finale-2")
          mount = mount.replace("./ivo-rock-polish.js?v=full-polish-1", "./ivo-rock-polish.js?v=rock-finale-2")
          mount_path.write_text(mount)

          index = index_path.read_text()
          index = index.replace("./mount.js?v=full-polish-1", "./mount.js?v=rock-finale-2")
          index_path.write_text(index)

      - name: Validate JavaScript
        run: |
          node --check salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js
          node --check salto-cosmico-rock/ivo-rock-polish.js
          node --check salto-cosmico-rock/mount.js

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js salto-cosmico-rock/ivo-rock-polish.js salto-cosmico-rock/mount.js salto-cosmico-rock/index.html
          git commit -m "Upgrade Ivo Rock level finales and clean Route 3 backdrop"
          git push origin master
