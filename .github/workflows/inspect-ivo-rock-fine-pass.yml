name: Inspect current Ivo Rock fine polish points

on:
  push:
    paths:
      - '.github/workflows/inspect-ivo-rock-fine-pass.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Print relevant engine snippets
        shell: python
        run: |
          from pathlib import Path
          s=Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js').read_text()
          def ctx(label, needle, before=650, after=1600):
              i=s.find(needle)
              print('\n###',label,'idx',i)
              if i>=0: print(s[max(0,i-before):min(len(s),i+after)])
          ctx('R update','R=R.filter')
          ctx('R render','R.forEach')
          ctx('pickup handler','Ye=')
          ctx('reward draw','reward')
          ctx('power impact','window.__ivoRockPolish?.impact(`power`)')
          ctx('draw player vicinity','J.x-D')
          ctx('render enemies','for(let t of L)')
