name: Inspect current Ivo Rock fine polish points

on:
  push:
    paths:
      - '.github/workflows/inspect-ivo-rock-fine-pass.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Print relevant engine snippets
        shell: python
        run: |
          from pathlib import Path
          s=Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js').read_text()
          def ctx(label, needle, before=850, after=2400):
              i=s.find(needle)
              print('\n###',label,'idx',i)
              if i>=0: print(s[max(0,i-before):min(len(s),i+after)])
          ctx('powerup draw def','pt=')
          ctx('enemy size def','Ae=')
          ctx('enemy init def','je=')
          for lid in [1,2,3,4]:
              i=s.find(f'{{id:{lid},name:')
              j=s.find('platforms:[',i)
              print(f'\n### LEVEL {lid} ENEMIES/BLOCKS\n', s[max(i,j-1800):j+500] if i>=0 and j>=0 else 'missing')
