name: Apply Boleto V50 Lock

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved v50 behavior
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('boleto-estudiantil-final/index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace(
              '<button type="button" id="nav2" data-go-step="2">',
              '<button type="button" id="nav2" class="locked" data-go-step="2">'
          )
          html = html.replace(
              '<button class="btn primary" type="button" data-next-step="2">Leí los requisitos y cumplo</button>',
              '<button class="btn primary" type="button" id="acceptReqBtn" data-next-step="2">Leí los requisitos y cumplo</button>'
          )
          html = html.replace(
              'let prepared=false;',
              'let prepared=false,requirementsAccepted=false;'
          )

          html = html.replace(
              "document.querySelectorAll('[data-next-step]').forEach(b=>b.addEventListener('click',()=>step(b.dataset.nextStep)));",
              "document.querySelectorAll('[data-next-step]').forEach(b=>b.addEventListener('click',()=>{let n=b.dataset.nextStep;if(n==='2'&&b.id==='acceptReqBtn'){requirementsAccepted=true;document.getElementById('nav2').classList.remove('locked');step(2);return;}if(n==='2'&&!requirementsAccepted)return;step(n)}));"
          )
          html = html.replace(
              "document.querySelectorAll('[data-go-step]').forEach(b=>b.addEventListener('click',()=>{let n=b.dataset.goStep;if(n==='3'&&!prepared)return;step(n)}));",
              "document.querySelectorAll('[data-go-step]').forEach(b=>b.addEventListener('click',()=>{let n=b.dataset.goStep;if(n==='2'&&!requirementsAccepted)return;if(n==='3'&&!prepared)return;step(n)}));"
          )

          if 'Volver a datos y advertencia' in html:
              raise SystemExit('No se sube: reapareció el botón Volver a datos y advertencia')
          if 'data:image/' not in html or 'El trámite caducó' not in html:
              raise SystemExit('No se sube: falta la imagen embebida del trámite caducado')
          if 'requirementsAccepted=false' not in html or "if(n==='2'&&!requirementsAccepted)return" not in html:
              raise SystemExit('No se sube: no quedó bloqueado el paso 2')

          path.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/apply-boleto-v50-lock.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply boleto v50 approved fixes" || echo "No changes to commit"
          git push
