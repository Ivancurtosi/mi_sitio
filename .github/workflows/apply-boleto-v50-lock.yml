name: Apply Boleto V50 Lock

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved v50 behavior
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('boleto-estudiantil-final/index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace(
              '<button class="btn primary" type="button" data-next-step="2">Leí los requisitos y cumplo</button>',
              '<button class="btn primary" type="button" id="acceptReqBtn" data-next-step="2">Leí los requisitos y cumplo</button>'
          )

          if 'let requirementsAccepted = false;' not in html:
              html = html.replace('let highestStepUnlocked = 1;', 'let highestStepUnlocked = 1;\nlet requirementsAccepted = false;')

          old_jump = """document.querySelectorAll('[data-jump-step]').forEach(item => {
  const go = () => {
    const n = Number(item.getAttribute('data-jump-step'));
    if (n <= highestStepUnlocked) setWizardStep(n);
  };
  item.addEventListener('click', go);
  item.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      go();
    }
  });
});"""

          new_jump = """document.querySelectorAll('[data-jump-step]').forEach(item => {
  const go = () => {
    const n = Number(item.getAttribute('data-jump-step'));
    if ((n === 2 || n === 3) && !requirementsAccepted) return;
    if (n === 3 && !allPrepared) return;
    if (n <= highestStepUnlocked) setWizardStep(n);
  };
  item.addEventListener('click', go);
  item.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      go();
    }
  });
});"""
          html = html.replace(old_jump, new_jump)

          old_next = """document.querySelectorAll('[data-next-step]').forEach(btn => {
  btn.addEventListener('click', () => {
    const n = btn.getAttribute('data-next-step');
    setWizardStep(n);
    document.getElementById('flujo-tramite').scrollIntoView({behavior:'smooth', block:'start'});
  });
});"""

          new_next = """document.querySelectorAll('[data-next-step]').forEach(btn => {
  btn.addEventListener('click', () => {
    const n = Number(btn.getAttribute('data-next-step'));
    if (n === 2) {
      if (btn.id !== 'acceptReqBtn') return;
      requirementsAccepted = true;
      highestStepUnlocked = Math.max(highestStepUnlocked, 2);
      refreshWizardNav();
    }
    if ((n === 2 || n === 3) && !requirementsAccepted) return;
    setWizardStep(n);
    document.getElementById('flujo-tramite').scrollIntoView({behavior:'smooth', block:'start'});
  });
});"""
          html = html.replace(old_next, new_next)

          if 'Volver a datos y advertencia' in html:
              raise SystemExit('No se sube: reapareció el botón Volver a datos y advertencia')
          if 'data:image/' not in html or 'El trámite caducó' not in html:
              raise SystemExit('No se sube: falta la imagen embebida del trámite caducado')
          if 'id="acceptReqBtn"' not in html or 'requirementsAccepted = false' not in html:
              raise SystemExit('No se sube: no quedó bloqueado el paso 2')

          path.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/apply-boleto-v50-lock.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply boleto v50 approved fixes" || echo "No changes to commit"
          git push
