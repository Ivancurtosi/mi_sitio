name: Fix Boleto Caducado Image SVG

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write SVG image file and patch HTML
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" height="385">
            <rect width="900" height="385" fill="#ffffff"/>
            <g transform="translate(34 38)">
              <rect x="0" y="0" width="98" height="98" rx="49" fill="#eaf8f9" stroke="#2aa7b0" stroke-width="3"/>
              <text x="49" y="57" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2a9aaa">BA</text>
            </g>
            <text x="164" y="80" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1f1f1f">GOBIERNO DE LA PROVINCIA DE</text>
            <text x="164" y="116" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#2c9fb0">BUENOS AIRES</text>
            <text x="552" y="70" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="500" fill="#474747">Beneficio Boleto</text>
            <text x="552" y="122" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="500" fill="#474747">Estudiantil</text>
            <text x="36" y="207" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">Warning:</text>
            <text x="128" y="207" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">Cannot modify header information - headers already sent by (output started at</text>
            <text x="36" y="237" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">/var/www/html/boletoeducativo/boletov3/web/datos_personales.php:54) in</text>
            <text x="36" y="267" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">/var/www/html/boletoeducativo/boletov3/web/includes/expirationCheck.php on line 25</text>
            <text x="36" y="346" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#111111">El tramite caduco</text>
          </svg>'''

          img_path = Path('boleto-estudiantil-final/caducado-ejemplo.svg')
          img_path.write_text(svg, encoding='utf-8')

          path = Path('boleto-estudiantil-final/index.html')
          html = path.read_text(encoding='utf-8')

          html, count = re.subn(
              r'(<div class="shot"><img src=")[^"]+(" alt="Ejemplo del mensaje El trámite caducó">)',
              r'\1./caducado-ejemplo.svg\2',
              html,
              count=1,
              flags=re.S
          )

          if count != 1 and './caducado-ejemplo.svg' not in html:
              raise SystemExit('No se pudo reemplazar la imagen del trámite caducado')
          if 'Volver a datos y advertencia' in html:
              raise SystemExit('No se sube: reapareció el botón Volver a datos y advertencia')
          if 'id="acceptReqBtn"' not in html or 'requirementsAccepted=false' not in html:
              raise SystemExit('No se sube: no quedó bloqueado el paso 2')

          path.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/fix-boleto-caducado-svg.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use SVG file for boleto caducado image" || echo "No changes to commit"
          git push