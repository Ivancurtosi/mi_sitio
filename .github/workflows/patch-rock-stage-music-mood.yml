name: Patch Rock Tour stage music mood

on:
  push:
    paths:
      - '.github/workflows/patch-rock-stage-music-mood.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Darken route 2 and add final boss music cue
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js')
          text = path.read_text()

          replacements = [
              (
                  'cavern:{sky:`#030205`,soil:`#211c27`,edge:`#8d2836`,deep:`#050306`,accent:`#c9c6d4`,haze:`#19071d`}',
                  'cavern:{sky:`#010102`,soil:`#16121c`,edge:`#6f1f31`,deep:`#020103`,accent:`#c9c6d4`,haze:`#0b030f`}'
              ),
              (
                  'cavern:`rgba(12, 2, 18, .36)`',
                  'cavern:`rgba(5, 0, 10, .58)`'
              ),
              (
                  'J.x>=E.goalX-560&&n&&q.time<=0&&Y(`EL GUARDIÁN DEL RUIDO`,`6 golpes: saltale encima o usá RIFF`,1.2)',
                  'J.x>=E.goalX-560&&n&&q.time<=0&&(window.__rockPlaylist?.play(`boss`),Y(`EL GUARDIÁN DEL RUIDO`,`6 golpes: saltale encima o usá RIFF`,1.2))'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected pattern not found: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js
          git commit -m 'Set stage music progression and darken route 2'
          git push
