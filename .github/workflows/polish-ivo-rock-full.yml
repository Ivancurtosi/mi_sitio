          replace_once(old_projectiles, new_projectiles, 'wave projectile visual')

          # Distinct readable drawings for the three new enemy types.
          old_sentry_visual = "if(t.kind===`sentry`){e.save(),e.translate(t.x+t.w/2,t.y+t.h/2),e.fillStyle=`#5c4b8f`,e.beginPath();for(let t=0;t<8;t++){let n=t*Math.PI/4,r=t%2==0?28:20,i=Math.cos(n)*r,a=Math.sin(n)*r;t===0?e.moveTo(i,a):e.lineTo(i,a)}e.closePath(),e.fill(),e.fillStyle=`#79fff1`,e.fillRect(-12,-7,24,14),e.fillStyle=`#10152f`,e.fillRect(J.x<t.x?-8:3,-4,5,7),e.restore();return}"
          new_sentry_visual = "if(t.kind===`bat`){e.save(),e.translate(t.x+t.w/2,t.y+t.h/2),e.fillStyle=`#211128`;let n=8+Math.sin(T*11+t.phase)*7;e.beginPath(),e.moveTo(-5,0),e.lineTo(-25,-n),e.lineTo(-21,9),e.lineTo(-8,5),e.closePath(),e.fill(),e.beginPath(),e.moveTo(5,0),e.lineTo(25,-n),e.lineTo(21,9),e.lineTo(8,5),e.closePath(),e.fill(),e.fillStyle=`#5b245f`,e.beginPath(),e.ellipse(0,2,9,13,0,0,Math.PI*2),e.fill(),e.fillStyle=`#79fff1`;for(let n of[-3,3])e.beginPath(),e.arc(n,-2,1.8,0,Math.PI*2),e.fill();e.restore();return}if(t.kind===`amp`){e.save(),e.translate(t.x+t.w/2,t.y+t.h/2),e.shadowColor=`#5dfff0`,e.shadowBlur=t.cooldown<.28?18:5,e.fillStyle=`#111216`,Q(e,-27,-24,54,48,5),e.fill(),e.strokeStyle=`#777b82`,e.lineWidth=3,e.stroke(),e.fillStyle=`#050506`;for(let n of[-13,13]){e.beginPath(),e.arc(n,7,9,0,Math.PI*2),e.fill(),e.strokeStyle=`#4e535a`,e.lineWidth=2,e.stroke()}e.fillStyle=t.cooldown<.28?`#7dfff2`:`#e73b32`,e.fillRect(-20,-17,9,4),e.fillStyle=`#f4ce63`,e.fillRect(12,-17,7,4),e.restore();return}if(t.kind===`jumper`){e.save(),e.translate(t.x+t.w/2,t.y+t.h/2),e.fillStyle=`#5d1525`,e.beginPath(),e.ellipse(0,2,17,16,0,0,Math.PI*2),e.fill(),e.fillStyle=`#17151a`,Q(e,-16,-15,32,12,5),e.fill(),e.fillStyle=`#ffe36e`;for(let n of[-6,6])e.beginPath(),e.arc(n,-3,2.2,0,Math.PI*2),e.fill();e.strokeStyle=`#c6c8ca`,e.lineWidth=3;for(let n of[-9,9]){e.beginPath(),e.moveTo(n,14),e.lineTo(n-3,20),e.lineTo(n+3,25),e.stroke()}e.fillStyle=`#24252a`,e.fillRect(-18,23,13,5),e.fillRect(5,23,13,5),e.restore();return}" + old_sentry_visual
          replace_once(old_sentry_visual, new_sentry_visual, 'new enemy visuals')

          # Phase-two devil glows hotter and grows a flame aura.
          replace_once(
              "if(t.kind===`warden`){e.save();let n=1+Math.sin(T*5)*.025;e.translate(t.x+t.w/2,t.y+t.h/2),e.scale(n,n),e.shadowColor=t.guard>0?`#ffe66a`:`#ff2b16`,e.shadowBlur=22,",
