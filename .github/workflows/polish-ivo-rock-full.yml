          replace_once(old_warden, new_warden, 'boss phase two and jumper behavior')

          # Sound-wave projectiles travel straight; fireballs keep their arc.
          replace_once("t.vy+=(t.kind===`flare`?440:80)*e", "t.vy+=(t.kind===`flare`?440:t.kind===`wave`?0:80)*e", 'wave physics')

          old_projectiles = "for(let t of B)$(t)&&(e.save(),e.translate(t.x+t.w/2,t.y+t.h/2),t.kind===`flare`?(e.rotate(Math.atan2(t.vy,t.vx)),e.shadowColor=`#ff3a13`,e.shadowBlur=20,e.fillStyle=`rgba(255,67,18,.52)`,e.beginPath(),e.moveTo(-t.w*1.25,0),e.lineTo(-t.w*.12,-t.h*.46),e.lineTo(-t.w*.12,t.h*.46),e.closePath(),e.fill(),e.fillStyle=`#ff5a1f`,e.beginPath(),e.arc(0,0,t.w*.52,0,Math.PI*2),e.fill(),e.fillStyle=`#ffd95a`,e.beginPath(),e.arc(t.w*.10,-t.h*.08,t.w*.25,0,Math.PI*2),e.fill()):(e.shadowColor=`#ff628e`,e.shadowBlur=14,e.fillStyle=`#ff628e`,e.beginPath(),e.arc(0,0,t.w/2,0,Math.PI*2),e.fill()),e.restore());"
