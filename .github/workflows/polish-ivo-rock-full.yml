name: Full Ivo Rock gameplay polish

on:
  push:
    paths:
      - '.github/workflows/polish-ivo-rock-full.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Polish boss levels enemies celebration and effects
        shell: python
        run: |
          from pathlib import Path
          import re

          game = Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js')
          s = game.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} pattern not found')
              s = s.replace(old, new, 1)

          # Three new enemy families: flying bat, sound-wave amplifier and jumping roadie.
          replace_once(
              "Ae=e=>e===`warden`?{w:92,h:82}:e===`sentry`?{w:44,h:54}:e===`wisp`?{w:44,h:40}:e===`crawler`?{w:44,h:42}:{w:42,h:36}",
              "Ae=e=>e===`warden`?{w:92,h:82}:e===`amp`?{w:54,h:48}:e===`bat`?{w:50,h:34}:e===`jumper`?{w:44,h:42}:e===`sentry`?{w:44,h:54}:e===`wisp`?{w:44,h:40}:e===`crawler`?{w:44,h:42}:{w:42,h:36}",
              'enemy sizes'
          )
          replace_once(
              "je=()=>E.enemies.map((e,t)=>{let n=Ae(e.kind),r=De(e.x+n.w/2),i=e.y??r-n.h,a=e.dir??-1,o=e.kind===`crawler`?72:e.kind===`beetle`?82:e.kind===`spike`?68:0;return{id:t,x:e.x,y:i,w:n.w,h:n.h,kind:e.kind,state:`walk`,vx:a*o,vy:0,originX:e.x,originY:i,range:e.range??(e.kind===`warden`?250:80),phase:t*1.73%(Math.PI*2),active:!0,awake:!1,grounded:e.y===void 0,guard:0,cooldown:.7+t%4*.22,health:e.kind===`warden`?6:1}})",
              "je=()=>E.enemies.map((e,t)=>{let n=Ae(e.kind),r=De(e.x+n.w/2),i=e.y??r-n.h,a=e.dir??-1,o=e.kind===`crawler`?72:e.kind===`beetle`?82:e.kind===`spike`?68:e.kind===`jumper`?94:0;return{id:t,x:e.x,y:i,w:n.w,h:n.h,kind:e.kind,state:`walk`,vx:a*o,vy:0,originX:e.x,originY:i,range:e.range??(e.kind===`warden`?250:e.kind===`bat`?125:80),phase:t*1.73%(Math.PI*2),active:!0,awake:!1,grounded:e.y===void 0,guard:0,cooldown:.7+t%4*.22,phase2:!1,health:e.kind===`warden`?6:1}})",
              'enemy initialization'
          )

          def add_enemies(level_id, additions):
              global s
              marker = f'{{id:{level_id},name:'
              start = s.find(marker)
              if start < 0:
                  raise SystemExit(f'level {level_id} not found')
              next_start = s.find('{id:', start + len(marker))
              end = next_start if next_start >= 0 else s.find('],v=n()', start)
              chunk = s[start:end]
              m = re.search(r'enemies:\[(.*?)\],platforms:\[', chunk)
              if not m:
                  raise SystemExit(f'level {level_id} enemies array not found')
              current = m.group(1)
              if any(f'kind:`{kind}`' in current for kind in ['amp','bat','jumper']):
                  raise SystemExit(f'level {level_id} already contains polish enemies')
              insert = current + (',' if current else '') + ','.join(additions)
              chunk = chunk[:m.start(1)] + insert + chunk[m.end(1):]
              s = s[:start] + chunk + s[end:]

          add_enemies(1, ["{x:4680,kind:`amp`,dir:-1}", "{x:6040,kind:`jumper`,dir:-1}"])
          add_enemies(2, ["{x:1780,y:360,kind:`bat`,range:120}", "{x:5140,kind:`amp`,dir:-1}"])
          add_enemies(3, ["{x:1460,y:330,kind:`bat`,range:135}", "{x:5720,kind:`jumper`,dir:-1}"])
          add_enemies(4, ["{x:2280,y:340,kind:`bat`,range:125}", "{x:6120,kind:`amp`,dir:-1}"])

          # Flying bats move on a more aggressive oval. Amplifiers shoot horizontal sound waves.
          old_special = "if(n.kind===`wisp`)n.phase+=e*1.8,n.y=n.originY+Math.sin(n.phase)*n.range*.42,n.x=n.originX+Math.cos(n.phase*.62)*n.range;else if(n.kind===`sentry`){if(n.vx=0,n.cooldown<=0&&Math.abs(J.x-n.x)<620){let e=J.x<n.x?-1:1;B.push({x:n.x+n.w/2,y:n.y+14,w:14,h:14,vx:e*260,vy:-32,life:3.1,active:!0,kind:`spark`}),n.cooldown=1.65}}"
          new_special = "if(n.kind===`wisp`)n.phase+=e*1.8,n.y=n.originY+Math.sin(n.phase)*n.range*.42,n.x=n.originX+Math.cos(n.phase*.62)*n.range;else if(n.kind===`bat`)n.phase+=e*3.25,n.y=n.originY+Math.sin(n.phase)*n.range*.42,n.x=n.originX+Math.cos(n.phase*.72)*n.range*.82,n.vx=Math.cos(n.phase*.72)>=0?78:-78;else if(n.kind===`amp`){if(n.vx=0,n.cooldown<=0&&Math.abs(J.x-n.x)<560){let e=J.x<n.x?-1:1;B.push({x:n.x+n.w/2+e*20,y:n.y+15,w:18,h:18,vx:e*300,vy:0,life:3.4,active:!0,kind:`wave`}),B.push({x:n.x+n.w/2+e*18,y:n.y+29,w:14,h:14,vx:e*335,vy:0,life:3.05,active:!0,kind:`wave`}),n.cooldown=1.85}}else if(n.kind===`sentry`){if(n.vx=0,n.cooldown<=0&&Math.abs(J.x-n.x)<620){let e=J.x<n.x?-1:1;B.push({x:n.x+n.w/2,y:n.y+14,w:14,h:14,vx:e*260,vy:-32,life:3.1,active:!0,kind:`spark`}),n.cooldown=1.65}}"
          replace_once(old_special, new_special, 'new enemy behavior')

          # Final boss now has a real phase two. At half health it ignites, accelerates and fires faster.
          old_warden = "else if(n.kind===`warden`){if(n.guard<=0){let t=J.x<n.x?-145:145;n.vx=se(n.vx,t,360*e)}if(n.cooldown<=0){if(Math.abs(J.x-n.x)<700){let e=J.x<n.x?-1:1,r=Math.floor(T*1.7)%3;B.push({x:n.x+n.w/2+e*18,y:n.y+30,w:24,h:24,vx:e*330,vy:-300,life:5.2,active:!0,kind:`flare`}),B.push({x:n.x+n.w/2+e*16,y:n.y+42,w:22,h:22,vx:e*355,vy:-180,life:5.2,active:!0,kind:`flare`}),r===2&&B.push({x:n.x+n.w/2+e*12,y:n.y+20,w:20,h:20,vx:e*305,vy:-390,life:5.4,active:!0,kind:`flare`})}n.vy=-420,n.cooldown=1.35}let r=n.x;n.x+=n.vx*e,Ke(n,t,r,!0),n.x=S(n.x,E.goalX-540,E.goalX-180-n.w);let i=n.y+n.h;n.vy=Math.min(780,n.vy+1500*e),n.y+=n.vy*e,n.grounded=!1,Je(n,i,e,0)}else{let r=n.x;"
