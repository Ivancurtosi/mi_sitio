          replace_once(old_grove, new_grove, 'grove identity')

          old_cavern = "E.biome===`cavern`&&(e.save(),e.fillStyle=`rgba(0,0,0,.78)`,e.beginPath(),e.moveTo(0,0),Array.from({length:16},(_,rr)=>rr).forEach(rr=>{let xx=rr*t/15,yy=52+((rr*37)%5)*25;e.lineTo(xx,yy)}),e.lineTo(t,0),e.closePath(),e.fill(),e.globalAlpha=.28,e.fillStyle=`#5e1d78`,e.fillRect(0,500,t,220),e.globalAlpha=.18,e.fillStyle=`#b547cf`,Array.from({length:7},(_,rr)=>rr).forEach(rr=>{let xx=t*(.08+rr*.15);e.fillRect(xx,94+(rr%3)*38,3,300)}),e.restore())"
          new_cavern = "E.biome===`cavern`&&(e.save(),e.fillStyle=`rgba(0,0,0,.78)`,e.beginPath(),e.moveTo(0,0),Array.from({length:16},(_,rr)=>rr).forEach(rr=>{let xx=rr*t/15,yy=52+((rr*37)%5)*25;e.lineTo(xx,yy)}),e.lineTo(t,0),e.closePath(),e.fill(),e.globalAlpha=.28,e.fillStyle=`#5e1d78`,e.fillRect(0,500,t,220),e.globalAlpha=.18,e.fillStyle=`#b547cf`,Array.from({length:7},(_,rr)=>rr).forEach(rr=>{let xx=t*(.08+rr*.15);e.fillRect(xx,94+(rr%3)*38,3,300)}),e.globalAlpha=.3,e.strokeStyle=`#8b6aa5`,e.lineWidth=6,Array.from({length:5},(_,rr)=>rr).forEach(rr=>{let xx=t*(.12+rr*.19);e.beginPath(),e.moveTo(xx,0),e.bezierCurveTo(xx+40,150,xx-45,285,xx+20,440),e.stroke()}),e.globalAlpha=.22,e.fillStyle=`#d347e5`,e.fillRect(t*.67,174,112,27),e.fillStyle=`#09020c`,e.fillRect(t*.67+7,180,98,15),e.restore())"
          replace_once(old_cavern, new_cavern, 'cavern identity')

          old_sky = "E.biome===`sky`&&(e.save(),e.globalAlpha=.15,e.fillStyle=`#aab9dc`,e.beginPath(),e.arc(t*.82,112,50,0,Math.PI*2),e.fill(),e.strokeStyle=`rgba(145,175,220,.32)`,e.lineWidth=2,Array.from({length:18},(_,rr)=>rr).forEach(rr=>{let xx=(rr*101+T*185)%Math.max(1,t),yy=(rr*47+T*255)%610;e.beginPath(),e.moveTo(xx,yy),e.lineTo(xx-16,yy+44),e.stroke()}),e.restore())"
          new_sky = "E.biome===`sky`&&(e.save(),e.globalAlpha=.15,e.fillStyle=`#aab9dc`,e.beginPath(),e.arc(t*.82,112,50,0,Math.PI*2),e.fill(),e.strokeStyle=`rgba(145,175,220,.32)`,e.lineWidth=2,Array.from({length:18},(_,rr)=>rr).forEach(rr=>{let xx=(rr*101+T*185)%Math.max(1,t),yy=(rr*47+T*255)%610;e.beginPath(),e.moveTo(xx,yy),e.lineTo(xx-16,yy+44),e.stroke()}),e.globalAlpha=.25,e.strokeStyle=`#6f7890`,e.lineWidth=5,e.strokeRect(t*.08,390,t*.84,88),e.beginPath(),Array.from({length:9},(_,rr)=>rr).forEach(rr=>{let xx=t*(.1+rr*.1);e.moveTo(xx,390),e.lineTo(xx+45,478)}),e.stroke();let rr=Math.max(0,Math.sin(T*1.55)-.992)*70;rr>0&&(e.globalAlpha=Math.min(.38,rr),e.fillStyle=`#dce8ff`,e.fillRect(0,0,t,720)),e.restore())"
          replace_once(old_sky, new_sky, 'sky identity')

          old_citadel = "E.biome===`citadel`&&(e.save(),e.globalAlpha=.22,e.fillStyle=`#3b0308`,e.fillRect(0,430,t,290),e.globalAlpha=.18,e.fillStyle=`#7b1119`,Array.from({length:12},(_,rr)=>rr).forEach(rr=>{let xx=(rr*137+T*28)%Math.max(1,t),yy=510-(rr%4)*35;e.beginPath(),e.arc(xx,yy,18+rr%3*9,0,Math.PI*2),e.fill()}),e.restore())"
          new_citadel = "E.biome===`citadel`&&(e.save(),e.globalAlpha=.22,e.fillStyle=`#3b0308`,e.fillRect(0,430,t,290),e.globalAlpha=.18,e.fillStyle=`#7b1119`,Array.from({length:12},(_,rr)=>rr).forEach(rr=>{let xx=(rr*137+T*28)%Math.max(1,t),yy=510-(rr%4)*35;e.beginPath(),e.arc(xx,yy,18+rr%3*9,0,Math.PI*2),e.fill()}),e.globalAlpha=.46,e.fillStyle=`#120507`,Array.from({length:7},(_,rr)=>rr).forEach(rr=>{let xx=t*(.04+rr*.155),hh=58+(rr%3)*34;e.fillRect(xx,500-hh,48,hh),e.fillStyle=`#050506`,e.beginPath(),e.arc(xx+24,480-hh*.45,13,0,Math.PI*2),e.fill(),e.fillStyle=`#120507`}),e.globalAlpha=.6,Array.from({length:25},(_,rr)=>rr).forEach(rr=>{let xx=(rr*83+T*(26+rr%5*7))%Math.max(1,t),yy=610-((rr*57+T*80)%360);e.fillStyle=rr%3?`#ff7a25`:`#ffd05a`,e.fillRect(xx,yy,2+rr%3,4+rr%4)}),e.restore())"
          replace_once(old_citadel, new_citadel, 'citadel identity')

          # Dynamic boss warning reflects the phase change.
          replace_once(
              "Y(`DIABLITO DEL METAL`,`Saltalo o derrotalo · cuidado con el fuego`,1.2)",
              "Y(n.health<=3?`DIABLITO EN LLAMAS`:`DIABLITO DEL METAL`,n.health<=3?`FASE 2 · más rápido y más fuego`:`Saltalo o derrotalo · cuidado con el fuego`,1.2)",
              'dynamic boss warning'
          )

          # A longer, more satisfying finish: extra score, particles, flash and an original mini guitar solo.
          old_goal = "!Te&&J.x+J.w>=E.goalX&&(Te=!0,G=2.35,J.invulnerable=9,u.current.left=!1,u.current.right=!1,X(Math.max(0,Math.ceil(O))*10+2e3),Y(ve===_.length-1?`¡GIRA COMPLETA!`:`RECITAL COMPLETO`,`Etapa ${E.id} superada`,2.1),o.current?.stopMusic(),o.current?.sfx(`goal`));"
          new_goal = "!Te&&J.x+J.w>=E.goalX&&(Te=!0,G=3.05,J.invulnerable=9,u.current.left=!1,u.current.right=!1,X(Math.max(0,Math.ceil(O))*10+2500),Z(E.goalX-42,520,`#ffe56b`,28,`spark`),Z(E.goalX+18,470,`#75fff2`,24,`spark`),Z(E.goalX-8,410,`#ff6d8f`,22,`spark`),Y(ve===_.length-1?`¡GIRA COMPLETA!`:`RECITAL COMPLETO`,`Etapa ${E.id} superada · bonus de tiempo`,2.65),o.current?.stopMusic(),o.current?.sfx(`goal`),window.__ivoRockPolish?.goal(ve===_.length-1,Math.max(0,Math.ceil(O))*10+2500));"
          replace_once(old_goal, new_goal, 'goal celebration')

          game.write_text(s)

          # Load the polish helper and bust caches without touching the simple start menu.
          mount = Path('salto-cosmico-rock/mount.js')
          ms = mount.read_text()
          if "cosmic-jump-DkePWGqE.js?v=devil-boss-1" not in ms:
              raise SystemExit('mount game cache pattern not found')
          ms = ms.replace("cosmic-jump-DkePWGqE.js?v=devil-boss-1", "cosmic-jump-DkePWGqE.js?v=full-polish-1", 1)
          if "await import('./ivo-rock-polish.js?v=full-polish-1');" not in ms:
              marker = "await import('./ivo-rock-start-menu.js?v=simple-menu-1');"
              if marker not in ms:
                  raise SystemExit('start menu import marker not found')
              ms = ms.replace(marker, "await import('./ivo-rock-polish.js?v=full-polish-1');\n" + marker, 1)
          mount.write_text(ms)

          index = Path('salto-cosmico-rock/index.html')
          ix = index.read_text()
          if "mount.js?v=devil-boss-1" not in ix:
              raise SystemExit('index mount cache pattern not found')
          ix = ix.replace("mount.js?v=devil-boss-1", "mount.js?v=full-polish-1", 1)
          if "ivo-rock-polish.css?v=full-polish-1" not in ix:
              css_marker = '<link rel="stylesheet" href="./ivo-rock-start-menu.css?v=simple-menu-1">'
              if css_marker not in ix:
                  raise SystemExit('menu css marker not found')
              ix = ix.replace(css_marker, css_marker + '\n  <link rel="stylesheet" href="./ivo-rock-polish.css?v=full-polish-1">', 1)
          index.write_text(ix)

      - name: Syntax check
        run: |
          cp salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js /tmp/game.mjs
          cp salto-cosmico-rock/mount.js /tmp/mount.mjs
          node --check /tmp/game.mjs
          node --check /tmp/mount.mjs
          node --check salto-cosmico-rock/ivo-rock-polish.js

      - name: Commit full polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js salto-cosmico-rock/mount.js salto-cosmico-rock/index.html
          git commit -m "Polish Ivo Rock boss levels enemies and finale"
          git push origin master
