          replace_once("e.fillStyle=`#631017`,e.beginPath(),e.ellipse(0,15,38,33", "e.fillStyle=r?`#8c1110`:`#631017`,e.beginPath(),e.ellipse(0,15,38,33", 'boss phase body')
