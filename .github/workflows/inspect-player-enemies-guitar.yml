name: Inspect Ivo player enemies and guitar

on:
  push:
    paths:
      - '.github/workflows/inspect-player-enemies-guitar.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Print current render and gameplay snippets
        shell: python
        run: |
          from pathlib import Path
          s=Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js').read_text()
          markers=[
            'J.shotPose','ae[','rock-hero','w(e,v','drawImage',
            'u={small:44,grown:76,crouched:34}',
            'kind===`beetle`','kind===`crawler`','kind===`turtle`','kind===`sentry`',
            'ht=e=>{let t=E.goalX'
          ]
          for m in markers:
            print('\n===== '+m+' =====')
            start=0; found=0
            while True:
              i=s.find(m,start)
              if i<0 or found>=8: break
              print(s[max(0,i-1500):min(len(s),i+3200)])
              print('\n---')
              found+=1; start=i+len(m)
            if not found: print('NOT FOUND')
