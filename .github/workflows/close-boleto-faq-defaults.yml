name: Close Boleto FAQ Defaults

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close FAQ details by default
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('boleto-estudiantil-final/index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace('<details class="faq-item" open>', '<details class="faq-item">')

          if '<details class="faq-item" open>' in html:
              raise SystemExit('No se pudo cerrar una FAQ abierta por defecto')
          if './caducado-ejemplo.svg' not in html:
              raise SystemExit('No se sube: falta la referencia a la imagen caducado-ejemplo.svg')
          if 'id="acceptReqBtn"' not in html or 'requirementsAccepted=false' not in html:
              raise SystemExit('No se sube: se perdió el bloqueo del paso 2')

          path.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/close-boleto-faq-defaults.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close boleto FAQ items by default" || echo "No changes to commit"
          git push