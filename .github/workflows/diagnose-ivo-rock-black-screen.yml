name: Diagnose Ivo Rock black screen

on:
  push:
    paths:
      - '.github/workflows/diagnose-ivo-rock-black-screen.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 20
      - name: Trace gt references
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('salto-cosmico-rock/assets/cosmic-jump-DkePWGqE.js')
          s=p.read_text()
          hits=list(re.finditer(r'\bgt\b',s))
          print('gt exact-word hits:',len(hits))
          for k,m in enumerate(hits):
              a=max(0,m.start()-500); b=min(len(s),m.end()+700)
              print(f'\n--- GT HIT {k+1} @ {m.start()} ---\n{s[a:b]}')
          for needle in ['gt=', 'let gt', 'const gt', ',gt=', 'gt=>']:
              print(needle, s.find(needle))
      - name: Start local server and run browser smoke test
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8765 >/tmp/ivo-http.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          echo "CHROME=$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8765/salto-cosmico-rock/?v=diag2' >/tmp/dom.txt 2>/tmp/chrome.log || true
          echo '--- CHROME JS ERRORS ---'
          grep -Ei 'INFO:CONSOLE.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/chrome.log | tail -80 || true
