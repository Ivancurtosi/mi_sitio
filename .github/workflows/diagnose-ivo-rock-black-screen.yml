name: Diagnose Ivo Rock black screen

on:
  push:
    paths:
      - '.github/workflows/diagnose-ivo-rock-black-screen.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Start local server and run browser smoke test
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8765 >/tmp/ivo-http.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          echo "CHROME=$CHROME"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium available"
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8765/salto-cosmico-rock/?v=diag' >/tmp/dom.txt 2>/tmp/chrome.log || true
          echo '--- CHROME ERRORS ---'
          grep -Ei 'Uncaught|ReferenceError|TypeError|SyntaxError|error' /tmp/chrome.log | tail -120 || true
          echo '--- DOM TAIL ---'
          tail -80 /tmp/dom.txt || true
          echo '--- HTTP LOG ---'
          cat /tmp/ivo-http.log || true
